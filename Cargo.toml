[workspace]
members = ["crates/*", "examples/*", "tools/*"]
default-members = [
    "crates/ad-core-rs",
    "crates/ad-plugins-rs",
    "crates/asyn-rs",
    "crates/epics-base-rs",
    "crates/epics-ca-rs",
    "crates/epics-macros-rs",
    "crates/epics-pva-rs",
    "crates/epics-bridge-rs",
    "crates/epics-rs",
    "crates/motor-rs",
    "crates/std-rs",
    "crates/scaler-rs",
    "crates/optics-rs",
    "crates/mqtt-rs",
    "crates/modbus-rs",
    "crates/epics-tools-rs",
    # The codegen drift gates live here as `#[test]`s. They are in
    # default-members so a BARE `cargo nextest run` catches a stale generated
    # table — a gate you have to remember to invoke is not a gate.
    "tools/dbd-codegen",
    "tools/env-codegen",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.23.0"
authors = ["Sang Woo Kim <sngwkim915@gmail.com>"]
license = "EPICS"
repository = "https://github.com/epics-rs/epics-rs"

[workspace.dependencies]
ad-core-rs = { path = "crates/ad-core-rs", version = "0.23.0" }
ad-plugins-rs = { path = "crates/ad-plugins-rs", version = "0.23.0" }
asyn-rs = { path = "crates/asyn-rs", version = "0.23.0" }
epics-base-rs = { path = "crates/epics-base-rs", version = "0.23.0" }
epics-ca-rs = { path = "crates/epics-ca-rs", version = "0.23.0" }
epics-macros-rs = { path = "crates/epics-macros-rs", version = "0.23.0" }
epics-pva-rs = { path = "crates/epics-pva-rs", version = "0.23.0" }
epics-bridge-rs = { path = "crates/epics-bridge-rs", version = "0.23.0" }
motor-rs = { path = "crates/motor-rs", version = "0.23.0" }
std-rs = { path = "crates/std-rs", version = "0.23.0" }
scaler-rs = { path = "crates/scaler-rs", version = "0.23.0" }
optics-rs = { path = "crates/optics-rs", version = "0.23.0" }
mqtt-rs = { path = "crates/mqtt-rs", version = "0.23.0" }
modbus-rs = { path = "crates/modbus-rs", version = "0.23.0", package = "epics-modbus-rs" }
epics-tools-rs = { path = "crates/epics-tools-rs", version = "0.23.0" }

