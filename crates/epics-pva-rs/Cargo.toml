[package]
name = "epics-pva-rs"
version.workspace = true
edition.workspace = true
description = "EPICS pvAccess protocol client (experimental)"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
epics-base-rs = { workspace = true }
epics-macros-rs = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1.0"
thiserror = "2"
socket2 = "0.5"
hostname = "0.4"
tokio-util = { version = "0.7", default-features = false }
# Refcounted byte buffer used by the raw-frame monitor forwarding path
# (F-G12). Lets fan-out broadcast `Bytes` clones (atomic increment)
# without copying multi-MB NTNDArray payloads.
bytes = "1"
parking_lot = "0.12"
dashmap = "6"
if-addrs = "0.13"

# TLS for `pvas://` (opt-in via `EPICS_PVAS_TLS_KEYCHAIN`).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# PKCS#12 (`.p12`/`.pfx`) keychain parsing — pvxs `PKCS12_parse` parity.
# Pure-Rust; opt-in via the `pkcs12` feature so PEM-only deployments
# can drop the extra dependency. Enabled by default.
p12 = { version = "0.6", optional = true }
# SHA-1 for PKCS#12 `localKeyID` reconstruction — OpenSSL sets a key
# bag's `localKeyID` to the SHA-1 of its leaf cert's DER, so matching
# `sha1(cert_der)` against the key bag's id reliably identifies the
# leaf when the cert bags themselves carry no `localKeyID`. Pulled in
# transitively by `p12` already, so this adds no new compile cost.
sha1 = { version = "0.10", optional = true }
# PBES2 (PBKDF2 + AES-CBC) PKCS#12 decryption — OpenSSL 3.x writes
# `.p12` files with PBES2 by default (no `-legacy`), which the classic
# `p12` crate cannot decrypt. We parse the PKCS#12 ASN.1 with the
# RustCrypto `pkcs12`/`der`/`cms` stack and decrypt PBES2-protected
# SafeContents / ShroudedKeyBags with `pkcs5`. The classic-PBE path
# still goes through `p12`; this RustCrypto path is a fallback the
# loader takes only when `p12` rejects the bag encryption (PBES2).
rc-pkcs12 = { package = "pkcs12", version = "=0.2.0-pre.0", optional = true, default-features = false, features = ["kdf"] }
pkcs5 = { version = "0.8", optional = true, default-features = false, features = ["pbes2", "alloc"] }
cms = { version = "=0.3.0-pre.1", optional = true, default-features = false }
der = { version = "0.8", optional = true, default-features = false, features = ["alloc", "oid"] }
spki = { version = "0.8", optional = true, default-features = false, features = ["alloc"] }
const-oid = { version = "0.10", optional = true, default-features = false }
# SHA-256 + SHA-1 + HMAC for the PKCS#12 keychain MAC (PKCS#12 KDF +
# HMAC, not PBES2). These pin to the `digest` 0.11 release line that
# the RustCrypto `pkcs12` KDF requires — distinct from the `sha1` 0.10
# used by `sha1_digest` for `localKeyID` reconstruction. Cargo links
# both majors side by side.
rc-sha2 = { package = "sha2", version = "0.11", optional = true }
rc-sha1 = { package = "sha1", version = "0.11", optional = true }
rc-hmac = { package = "hmac", version = "0.13.0-rc.2", optional = true }
# X.509 identity extraction from the verified TLS peer chain — pvxs
# `SSLContext::fill_credentials` parity (CN → ACF account, root CA CN →
# authority). Same crate/version `epics-ca-rs` already depends on.
x509-parser = "0.16"

[features]
default = ["pkcs12"]
# PKCS#12 keychain support in `auth::tls`. When disabled, the keychain
# loader falls back to PEM-only and rejects DER/PKCS#12 inputs.
# Covers both the classic PBE path (`p12`) and the PBES2/AES path
# (RustCrypto `rc-pkcs12`/`pkcs5`/`cms`/`der`), so any PKCS#12 written
# by OpenSSL 1.x or 3.x loads with the feature on.
pkcs12 = [
    "dep:p12",
    "dep:sha1",
    "dep:rc-pkcs12",
    "dep:pkcs5",
    "dep:cms",
    "dep:der",
    "dep:spki",
    "dep:const-oid",
    "dep:rc-sha2",
    "dep:rc-sha1",
    "dep:rc-hmac",
]

# POSIX getgrouplist / getpwuid / getgrgid for posix_groups() — pvxs
# osdGetRoles parity. The auth::plain::posix_groups() path is
# cfg-gated to return [] on non-Unix targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
serial_test = "3"

[[bin]]
name = "pvget-rs"
path = "src/bin/pvget-rs.rs"

[[bin]]
name = "pvput-rs"
path = "src/bin/pvput-rs.rs"

[[bin]]
name = "pvmonitor-rs"
path = "src/bin/pvmonitor-rs.rs"

[[bin]]
name = "pvinfo-rs"
path = "src/bin/pvinfo-rs.rs"
