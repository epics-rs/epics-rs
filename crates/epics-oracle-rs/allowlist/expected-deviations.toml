bucket = "INSTRUMENT-DEFECT"
enabled = false
upstream = "pvxs / ioc"
record_types = ["scalcout"]
fields = ["PAA", "PBB", "PCC", "PDD", "PEE", "PFF", "PGG", "PHH", "PII", "PJJ", "PKK", "PLL"]
surface = ["server_abort"]
why = """
CARRIED DISABLED. The defect below is real and was re-verified directly on
2026-08-31 -- a `pvxget ORACLE:SCALCOUT.PAA` against a freshly booted
softIocPVX serving one bare `record(scalcout, "ORACLE:SCALCOUT") {}` aborts it
with `corrupted size vs. prev_size`, core dumped, 1 of 1 -- but the oracle's own
read path does NOT trip it, and the row must not claim otherwise. Measured on the
full `--phase pva-read`: 3468 of 3468 channels measured on both contracts,
PAA..PLL included. The port now serves each as a scalar read-only DBF_STRING
(calc#42, charged to DESIGN-SCALCOUT-PREV-STRING-SCALAR) while the C side serves
the 40-element array; this row is only the server_abort contract, on which both
servers survive when the channels are read one at a time. Enabled, the row would
be reported STALE every run and fail it, asserting that a bug pvxs has not fixed
had gone away.

The defect. sCalcoutRecord.c's cvt_dbaddr, for fieldIndex scalcoutRecordPAA
through scalcoutRecordPLL, sets no_elements = STRING_SIZE (40) and then
UNCONDITIONALLY field_type = DBF_STRING, field_size = 1, dbr_field_type =
DBR_STRING -- a 40-element DBF_STRING array whose advertised element size is 1.
pvxs ioc/iocsource.cpp:124 sizes its buffer dbChannelFinalElements *
dbChannelFinalFieldSize = 40 * 1 = 40 bytes, then line 142 indexes that same
buffer at &(*buf)[n * MAX_STRING_SIZE] and dbChannelGet(DBR_STRING, nReq = 40)
writes 40 * 40 = 1600 bytes into it. 1560 bytes past the end. The fat
softIoc.dbd declares exactly twelve scalcout fields special(SPC_DBADDR) -- PAA
through PLL, each DBF_NOACCESS size(4) extra("char *pXX") -- and they are the
only ones whose dbAddr reaches cvt_dbaddr, hence this row's scope.

Why it does not fire here. The write corrupts the heap; the process then aborts
on whatever allocation comes next, which may belong to a later channel or to no
channel at all. So an abort is a property of a channel AND an allocation history,
not of the channel alone: batching 171 scalcout channels into one pvxget kills
the server outright, while reading the same 171 one at a time -- which is what
the harness falls back to once a batch dies -- leaves it serving every one of
them. pvaread.rs charges a channel only after it kills a server booted for it
alone, and under that rule none of the twelve was charged.

If it comes back, it comes back loud: an abort with no enabled row justifying it
is a DEFECT and fails the run. Flip `enabled` to true at that point, and delete
the row when pvxs fixes iocsource.cpp.

Verified at pvxs bd2243db05dace325a4ebff48f470c2a89f17d2b.
"""
