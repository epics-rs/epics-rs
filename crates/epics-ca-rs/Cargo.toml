[package]
name = "epics-ca-rs"
version.workspace = true
edition.workspace = true
description = "EPICS Channel Access protocol client and server"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
epics-base-rs = { workspace = true }
# The RTEMS boot shim for `realtime-ca-ioc`. Empty on every non-RTEMS target, so
# this is an unconditional dependency rather than a `cfg(target_os = "rtems")`
# one: that keeps `epics_rtems_boot::link_anchor()` a single uncfg'd call in
# the IOC's `main`. (The design's reason for gating it — that a host build
# would otherwise try to cross-compile C — is closed by the shim's build
# script, which no-ops off RTEMS.)
epics-rtems-boot = { workspace = true }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
metrics = "0.23"
async-trait = "0.1"
futures-util = "0.3"
dashmap = "6"
parking_lot = "0.12"
# Lock-free snapshot cell for the `calink` CA-link monitor caches.
arc-swap = "1"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
x509-parser = { version = "0.16", optional = true }
sha2 = { version = "0.10", optional = true }
mdns-sd = { version = "0.13", default-features = false, features = ["async"], optional = true }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"], optional = true }
hickory-client = { version = "0.24", default-features = false, features = ["dnssec-ring"], optional = true }
hickory-proto = { version = "0.24", default-features = false, features = ["dnssec-ring", "tokio-runtime"], optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
# Non-optional: the always-on `calink` module derives `thiserror::Error`
# for `CaLinkError`. cap-tokens / signed_beacon also use it.
thiserror = "1"
opentelemetry = { version = "0.24", optional = true }
opentelemetry_sdk = { version = "0.24", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.17", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
tracing-opentelemetry = { version = "0.25", optional = true }

# Host-only dependencies — gated out for the embedded targets (RTEMS's
# armv7-rtems-eabihf, and the `*-wrs-vxworks*` triples).
#
# The async CA front-end (`tokio::net` async server/client, the UDP net stack)
# is host-only: its deps do not build for RTEMS or VxWorks, and the embedded
# CA server uses the separate S1 `std::net` blocking driver
# (`server::blocking`), not these.
#
# tokio: the hosted build uses the full runtime; the embedded build drops the
# `net`, `signal`, and `process` features — the ones that pull `mio`,
# `signal-hook-registry`, and `socket2` (0.6 transitively), none of which build
# for armv7-rtems-eabihf or the `*-wrs-vxworks*` triples. Declared per-target
# rather than in shared `[dependencies]` because Cargo UNIONS a dependency's
# features across all matching tables, so a shared `full` would re-add the
# dropped features on either embedded target. The retained set
# (rt/rt-multi-thread/time/sync/macros/io/fs) keeps every non-net tokio API
# the always-compiled shared code uses (Handle, block_in_place, select!, sync
# primitives, tokio::io duplex/split) compiling there; those paths are unused
# there (the blocking driver drives via the runtime::task seam) but must
# still type-check for `--lib`.
#
# `socket2` (async TCP keepalive + UDP shared-port setup) and `if-addrs`
# (interface enumeration for beacons / mDNS / addr-list) back only the async
# front-end; the blocking driver sets socket options via raw `libc`. Both go
# host-only. The module gates (`server/mod.rs`, `server/udp.rs`, etc.) match
# this table via the `build.rs`-emitted `epics_embedded_target` cfg, which
# `Cargo.toml` target tables cannot reference directly (only built-in `cfg()`
# predicates), hence spelling the target-OS pair out here.
[target.'cfg(not(any(target_os = "rtems", target_os = "vxworks")))'.dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

[target.'cfg(any(target_os = "rtems", target_os = "vxworks"))'.dependencies]
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

# Windows reverse-DNS: `libc` has no `getnameinfo` on windows-msvc (it is a
# Winsock symbol, not a CRT one). `hostname.rs` calls Winsock's `getnameinfo`
# directly on Windows, the same resolver C EPICS uses there.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Console",
] }

[features]
# The full client — what every hosted build has always had, so an existing
# consumer sees no change. `--no-default-features` is what an RTEMS target
# build passes, and it is the configuration that gets to state its own
# selection (`scripts/rtems-check.sh`'s `CRATE_FEATURES`).
default = ["client"]
# The CA client a *record link* needs, and nothing else
# (`doc/calink-rtems-design.md` §2.1, §6 stage C2): `client`, `channel` and
# `calink` — search (UDP where it exists, `EPICS_CA_NAME_SERVERS` where it
# does not), the virtual circuit, subscriptions, and the `ca://` link
# resolver over them.
#
# A STATED split, not an absence. The alternative — leaving the discovery
# stack out of the target build by having no name for what is left — makes
# "the target's client" a thing nobody can select, build or test on a host,
# and the boundary then only exists inside `scripts/rtems-check.sh`. Named
# here, `--no-default-features --features client-core` is a configuration a
# host can compile and lint, which is what makes the split provable off the
# target. Same argument `epics-bridge-rs` makes for `qsrv-core` vs `qsrv`.
client-core = []
# `client-core` plus the host-only UDP discovery stack it does not need: the
# beacon monitor (`client::beacon_monitor`), CA repeater registration
# (`repeater`), service discovery (`discovery`) and the reverse-DNS peer-name
# cache (`hostname`). Every one of those is a UDP socket, a `getnameinfo`, or
# a dependency that does not build for `armv7-rtems-eabihf`; none of them is
# reachable from a record link.
client = ["client-core"]
# Host-selectable RTEMS execution model — passthrough to
# `epics-base-rs/rtems-exec-model`. Routes the `runtime::task` seam to the
# std-thread background executor on a hosted target, so the blocking CA
# server driver's async record-processing completion runs on the executor
# (callback pool + delayed timer + scanOnce) instead of a tokio runtime —
# the same backend the RTEMS build uses. OFF by default; the hosted default
# is byte-identical without it. See `crates/epics-base-rs/build.rs`.
rtems-exec-model = ["epics-base-rs/rtems-exec-model"]
# The RTEMS bring-up measurement rig (doc/calink-rtems-design.md §6 stage C6,
# gated by §11.7 item 3): the 14 C6 probe records in `realtime-ca-ioc`'s built-in
# database, its two probe threads (the tick task and the `c6-probe` reporter),
# and the compiled-in SLIRP search topology. OFF by default — the default
# binary is a clean IOC with no probe records, no probe threads and no link
# fields at all (the link-free image §11.7 item 4 needs). The bring-up box's
# build scripts add this flag to get exactly the measured C6 image back.
bringup-probes = []
# Bundled Prometheus exporter + tracing-subscriber init helpers.
# Without this feature consumers wire up their own observability
# stack via the bare `metrics` and `tracing` facades.
observability = ["dep:metrics-exporter-prometheus", "dep:tracing-subscriber"]
# EXPERIMENTAL Rust-only CA-over-TLS — NOT part of the EPICS spec.
#
# Enabling this and configuring TLS makes the IOC unreachable from
# C tools (caget, caput, camonitor, EDM, MEDM, CSS) and pyepics, since
# libca/rsrv have no TLS support. For production traffic encryption,
# prefer network-layer solutions (IPSec, WireGuard, site VPN) — they
# protect all EPICS traffic transparently and don't break interop.
#
# This feature exists for Rust-only deployments and as a foundation
# for future epics-base 7 `ca-secure` wire compatibility (NOT yet
# implemented; the wire format is currently Rust-only).
#
# See doc/11-tls-design.md for rationale and migration guidance.
experimental-rust-tls = [
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:x509-parser",
    "dep:sha2",
]
# mDNS + DNS-SD service discovery. Adds mdns-sd (link-local
# multicast) and hickory-resolver (unicast DNS PTR/SRV/TXT lookups).
# Server can announce itself via mDNS; client can auto-discover
# IOCs via mDNS and/or DNS-SD against an existing site DNS server.
# See doc/12-discovery.md.
discovery = ["dep:mdns-sd", "dep:hickory-resolver"]
# Dynamic DNS UPDATE (RFC 2136) for self-registering IOCs against a
# unicast DNS server. TSIG (RFC 2845) signing supported via
# HMAC-SHA256 / HMAC-SHA512. Adds hickory-client + base64.
discovery-dns-update = [
    "discovery",
    "dep:hickory-client",
    "dep:hickory-proto",
    "dep:base64",
]
# OpenTelemetry OTLP trace exporter. Wires the `tracing` ecosystem
# into a remote collector (Tempo, Jaeger, OTel Collector) over gRPC.
# Pulls in the opentelemetry-otlp + tracing-opentelemetry dep tree —
# leave off unless you actually need remote tracing.
otlp = [
    "observability",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Ed25519 capability tokens for identity-based access control. Used
# as an alternative to UNIX-style host/user matching for clients
# behind NAT, in containers, or otherwise unable to present a stable
# host identity. Adds ed25519-dalek + rand_core + base64.
cap-tokens = [
    "dep:ed25519-dalek",
    "dep:rand_core",
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
]

# `build.rs` calls `epics_rtems_boot::contract::emit_link_args()`. Also
# unconditional: a `[target.'cfg(...)'.build-dependencies]` table is evaluated
# against the HOST, so a `cfg(target_os = "rtems")` one would never match.
[build-dependencies]
epics-rtems-boot = { workspace = true }

[dev-dependencies]
# Dev-only, path-only (no `version`, so `cargo publish` strips the entry
# entirely): the shared `rtems-exec-model` test-gating census, called by
# `tests/rtems_exec_model_gate.rs`. Shared rather than copied because every
# crate that declares the feature has the same hole, and three copies of a
# 300-line audit is how three copies of a rule come to disagree.
rtems-exec-gate = { path = "../../tools/rtems-exec-gate" }
# Dev-only: `#[epics_test]` — the backend-selected test driver — for this
# crate's own suite.
epics-macros-rs = { workspace = true }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3"
proptest = "1"
rcgen = "0.13"
serial_test = "3"
# test-util is required for `tokio::test(start_paused = true)` and
# `tokio::time::pause`, used by the lazy-echo virtual-clock tests in
# client::transport. Pulled in only for tests so production builds
# don't carry the test runtime hooks.
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "end_to_end_bench"
harness = false

# The only example, and it plugs a custom `discovery::Backend` into
# `CaClientConfig` — both of which the full `client` feature owns.
[[example]]
name = "custom_discovery_backend"
path = "examples/custom_discovery_backend.rs"
required-features = ["client"]

[[bin]]
name = "caget-rs"
path = "src/bin/caget-rs.rs"
required-features = ["client-core"]

[[bin]]
name = "caput-rs"
path = "src/bin/caput-rs.rs"
required-features = ["client-core"]

[[bin]]
name = "camonitor-rs"
path = "src/bin/camonitor-rs.rs"
required-features = ["client-core"]

[[bin]]
name = "cainfo-rs"
path = "src/bin/cainfo-rs.rs"
required-features = ["client-core"]

[[bin]]
name = "ca-repeater-rs"
path = "src/bin/ca-repeater-rs.rs"

[[bin]]
name = "softioc-rs"
path = "src/bin/softioc-rs.rs"

[[bin]]
name = "ca-replay-rs"
path = "src/bin/ca-replay-rs.rs"

[[bin]]
name = "ca-lint-rs"
path = "src/bin/ca-lint-rs.rs"

[[bin]]
name = "ca-admin-rs"
path = "src/bin/ca-admin-rs.rs"

# The RTEMS CA IOC entry point (design doc §9.5). Deliberately NOT given
# `required-features`: it must be built by a bare `cargo check --bin
# realtime-ca-ioc --target armv7-rtems-eabihf`, and a `required-features` gate
# would make cargo silently *skip* the target instead, turning the RTEMS
# gate into a vacuous pass. Under the hosted default backend it compiles and
# is linted, but refuses to run (see the module docs).
[[bin]]
name = "realtime-ca-ioc"
path = "src/bin/realtime-ca-ioc.rs"

[[bin]]
name = "ca-soak"
path = "src/bin/ca-soak.rs"
required-features = ["client-core"]

[[bin]]
name = "ca-soak-observed"
path = "src/bin/ca-soak-observed.rs"
required-features = ["observability", "client-core"]
