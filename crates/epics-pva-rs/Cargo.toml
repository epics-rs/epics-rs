[package]
name = "epics-pva-rs"
version.workspace = true
edition.workspace = true
description = "EPICS pvAccess protocol client (experimental)"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
epics-base-rs = { workspace = true }
epics-macros-rs = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1.0"
thiserror = "2"
socket2 = "0.5"
hostname = "0.4"
tokio-util = { version = "0.7", default-features = false }
# Refcounted byte buffer used by the raw-frame monitor forwarding path
# (F-G12). Lets fan-out broadcast `Bytes` clones (atomic increment)
# without copying multi-MB NTNDArray payloads.
bytes = "1"
parking_lot = "0.12"
dashmap = "6"
if-addrs = "0.13"
# `FutureExt::catch_unwind` — converts a panic in a user-supplied source
# handler into an error reply rather than letting it skip the exec
# reply (PVXS-SR-21). Already a workspace dep (epics-ca-rs, ad-core-rs).
futures-util = "0.3"

# TLS for `pvas://` (opt-in at runtime via `EPICS_PVAS_TLS_KEYCHAIN`, and at
# compile time via the `tls` feature — ON by default, so a hosted build is
# unchanged).
#
# These three are the reason `cargo tree -p epics-pva-rs -e normal -i ring`
# resolved at all: `ring` drags `getrandom 0.2`, which `compile_error!`s on
# `armv7-rtems-eabihf`. They are optional so an RTEMS server build can drop
# the whole TLS stack (design doc §8.2; TLS on RTEMS proper — swapping ring
# for aws-lc-rs or a RustCrypto provider — is a separate, later problem).
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
], optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
], optional = true }
# PKCS#12 (`.p12`/`.pfx`) keychain parsing — pvxs `PKCS12_parse` parity.
# Pure-Rust; opt-in via the `pkcs12` feature so PEM-only deployments
# can drop the extra dependency. Enabled by default.
p12 = { version = "0.6", optional = true }
# SHA-1 for PKCS#12 `localKeyID` reconstruction — OpenSSL sets a key
# bag's `localKeyID` to the SHA-1 of its leaf cert's DER, so matching
# `sha1(cert_der)` against the key bag's id reliably identifies the
# leaf when the cert bags themselves carry no `localKeyID`. Pulled in
# transitively by `p12` already, so this adds no new compile cost.
sha1 = { version = "0.10", optional = true }
# PBES2 (PBKDF2 + AES-CBC) PKCS#12 decryption — OpenSSL 3.x writes
# `.p12` files with PBES2 by default (no `-legacy`), which the classic
# `p12` crate cannot decrypt. The PKCS#12 PFX / AuthenticatedSafe /
# ContentInfo / EncryptedData / SafeBag structures are plain ASN.1, so
# we parse them directly with the stable `der` crate (small `Sequence`
# types defined in `tls.rs`) and decrypt PBES2-protected SafeContents /
# ShroudedKeyBags with the stable `pkcs5` crate. The classic-PBE path
# still goes through `p12`; this stable-RustCrypto path is a fallback
# the loader takes only when `p12` rejects the bag encryption (PBES2).
# Every crate here is a stable crates.io release — no pre-release pins.
pkcs5 = { version = "0.8", optional = true, default-features = false, features = ["pbes2", "alloc"] }
der = { version = "0.8", optional = true, default-features = false, features = ["alloc", "oid", "derive"] }
spki = { version = "0.8", optional = true, default-features = false, features = ["alloc"] }
# SHA-256 + SHA-1 + HMAC for the PKCS#12 keychain MAC (PKCS#12 KDF +
# HMAC, not PBES2). These ride the stable `digest` 0.11 release line
# that `pkcs5`'s `pbes2` feature also uses — distinct from the `sha1`
# 0.10 used by `sha1_digest` for `localKeyID` reconstruction. Cargo
# links both majors side by side.
rc-sha2 = { package = "sha2", version = "0.11", optional = true }
rc-sha1 = { package = "sha1", version = "0.11", optional = true }
rc-hmac = { package = "hmac", version = "0.13", optional = true }
# X.509 identity extraction from the verified TLS peer chain — pvxs
# `SSLContext::fill_credentials` parity (CN → ACF account, root CA CN →
# authority). Same crate/version `epics-ca-rs` already depends on. Used only
# by `auth::tls`, so it rides the `tls` feature; the credential type it
# produces (`auth::x509::X509Credentials`) is plain data and stays compiled
# either way.
x509-parser = { version = "0.16", optional = true }

[features]
default = ["tls", "pkcs12"]
# TLS-secured pvAccess (`pvas://`) via rustls. ON by default. Turning it off
# drops rustls/tokio-rustls/rustls-pemfile/x509-parser — and with them `ring`
# and `getrandom 0.2`, the crate that does not build for RTEMS. With the
# feature off, `auth::TlsServerConfig`/`TlsClientConfig` become uninhabited
# placeholder types: the `tls` fields on `ServerConfig` / `PvaClientBuilder`
# still exist and still compile, but are provably `None` because no value of
# the config type can be constructed. See `auth::mod`.
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls", "dep:x509-parser"]
# PKCS#12 keychain support in `auth::tls`. When disabled, the keychain
# loader falls back to PEM-only and rejects DER/PKCS#12 inputs.
# Covers both the classic PBE path (`p12`) and the PBES2/AES path
# (stable `pkcs5`/`der`/`spki`), so any PKCS#12 written by OpenSSL 1.x
# or 3.x loads with the feature on.
#
# Implies `tls`: the whole PKCS#12 loader lives inside `auth::tls`, and a
# keychain with no TLS stack to install it into is meaningless. This also
# closes the SECOND `getrandom 0.2` path — `p12` depends on it directly, not
# only through `ring`.
pkcs12 = [
    "tls",
    "dep:p12",
    "dep:sha1",
    "dep:pkcs5",
    "dep:der",
    "dep:spki",
    "dep:rc-sha2",
    "dep:rc-sha1",
    "dep:rc-hmac",
]

# POSIX getgrouplist / getpwuid / getgrgid for posix_groups() — pvxs
# osdGetRoles parity. The auth::plain::posix_groups() path is
# cfg-gated to return [] on non-Unix targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WSARecvMsg + IP_PKTINFO for UDP original-destination recovery on
# Windows (client_native::udp), mirroring pvxs os/WIN32/osdSockExt.cpp.
# socket2 does not expose WSARecvMsg (a Winsock extension fn), so this
# raw FFI is required.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
serial_test = "3"

[[bin]]
name = "pvget-rs"
path = "src/bin/pvget-rs.rs"

[[bin]]
name = "pvput-rs"
path = "src/bin/pvput-rs.rs"

[[bin]]
name = "pvmonitor-rs"
path = "src/bin/pvmonitor-rs.rs"

[[bin]]
name = "pvinfo-rs"
path = "src/bin/pvinfo-rs.rs"
