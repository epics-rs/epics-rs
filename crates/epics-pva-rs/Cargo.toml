[package]
name = "epics-pva-rs"
version.workspace = true
edition.workspace = true
description = "EPICS pvAccess protocol client (experimental)"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
epics-base-rs = { workspace = true }
epics-macros-rs = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1.0"
thiserror = "2"
socket2 = "0.5"
hostname = "0.4"
tokio-util = { version = "0.7", default-features = false }
# Refcounted byte buffer used by the raw-frame monitor forwarding path
# (F-G12). Lets fan-out broadcast `Bytes` clones (atomic increment)
# without copying multi-MB NTNDArray payloads.
bytes = "1"
parking_lot = "0.12"
dashmap = "6"
if-addrs = "0.13"

# TLS for `pvas://` (opt-in via `EPICS_PVAS_TLS_KEYCHAIN`).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# PKCS#12 (`.p12`/`.pfx`) keychain parsing — pvxs `PKCS12_parse` parity.
# Pure-Rust; opt-in via the `pkcs12` feature so PEM-only deployments
# can drop the extra dependency. Enabled by default.
p12 = { version = "0.6", optional = true }
# X.509 identity extraction from the verified TLS peer chain — pvxs
# `SSLContext::fill_credentials` parity (CN → ACF account, root CA CN →
# authority). Same crate/version `epics-ca-rs` already depends on.
x509-parser = "0.16"

[features]
default = ["pkcs12"]
# PKCS#12 keychain support in `auth::tls`. When disabled, the keychain
# loader falls back to PEM-only and rejects DER/PKCS#12 inputs.
pkcs12 = ["dep:p12"]

# POSIX getgrouplist / getpwuid / getgrgid for posix_groups() — pvxs
# osdGetRoles parity. The auth::plain::posix_groups() path is
# cfg-gated to return [] on non-Unix targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
serial_test = "3"

[[bin]]
name = "pvget-rs"
path = "src/bin/pvget-rs.rs"

[[bin]]
name = "pvput-rs"
path = "src/bin/pvput-rs.rs"

[[bin]]
name = "pvmonitor-rs"
path = "src/bin/pvmonitor-rs.rs"

[[bin]]
name = "pvinfo-rs"
path = "src/bin/pvinfo-rs.rs"
