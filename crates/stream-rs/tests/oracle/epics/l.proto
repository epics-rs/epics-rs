Terminator = CR LF;
p { out "GET"; in "%d"; }
q { out "SET %d"; }
r { out "GET"; in "%d"; @init { out "I"; in "%d"; } }
args { out "$1 $2"; }
s { out "S"; in "%s"; }
d { out "D"; in "%f"; }
w { out "GET"; wait 100; in "%d"; }
t { ReplyTimeout = 100; out "GET"; in "%d"; }
c { connect 100; out "GET"; }
i { in "V=%d"; }
iw { wait 1000; in "V=%d"; }
ri { in "V=%d"; @init { out "I"; in "%d"; wait 300; } }
