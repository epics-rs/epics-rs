# Alicat_PCD.proto

# stream protocol file for Alicat PCD pressure controller

# Mark Rivers
# February 28, 2026

ExtraInput = Ignore;

getUnits {
   out "\$1 DCU 6";
   in  "\$1 %d";
}
setUnits {
   out "\$1 DCU 6 %d";
   in  "\$1";
   @init {
       out "\$1 DCU 6";
       in  "\$1 %d";
   }
}

getRamp {
   out "\$1 SR";
   in  "\$1%f";
}
setRamp {
   out "\$1 SR %f 4";
   @init {
       out "\$1 SR";
       in  "\$1%f";
   }
}

getPressure {
   out "\$1";
   in  "\$1 %f %(\$2)f%(\$3)40c";
}

getMaxPressure {
   out "\$1 LR";
   in  "\$1 38 %*f %f";
}
setMaxPressure {
   out "\$1 LR 38 0 0 %f";
   in  "\$1 38 %*f %*f";
   @init {
       out "\$1 LR";
       in  "\$1 38 %*f %f";
   }
}

setSetpoint {
   out "\$1 LS %f";
   @init {
       out "\$1";
       in  "\$1 %*f %f";
   }
}

setPause {
   out "\$1 HC";
}

setRun {
   out "\$1 C";
}

setVent {
   out "\$1 E";
   in  "\$1";
}

getValves {
   out "\$1 VD";
   in  "\$1 %f %(\$2)f";
}

getFirmware {
   out "\$1VE";
   in  "%*6c%80c";
}
