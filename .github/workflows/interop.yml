name: Interop (gated)

# Runs the wire-golden + interop nextest profile. Heavy: builds
# epics-base (CA reference) and pvxs (PVA reference) on the runner.
# Triggered manually + on a weekly cadence, and on pull requests.
#
# `interop` is a REQUIRED status check. If the trigger itself were
# path-filtered, a PR that touches none of the wire/interop sources
# would skip the whole workflow, the `interop` check would never
# report, and branch protection would leave that PR permanently
# BLOCKED. To avoid that, the workflow ALWAYS triggers on pull_request
# and a cheap `changes` job decides whether the heavy `interop` job
# runs. When the PR touches none of the interop paths, `interop` is
# skipped via its `if:` — GitHub reports a skipped required job as
# success, satisfying the check WITHOUT building pvxs/epics-base.
# Manual and scheduled runs always run the heavy job.
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 03:00 UTC. Catches reference-implementation drift
    # without delaying weekday PRs.
    - cron: '0 3 * * 0'
  pull_request: {}

env:
  CARGO_TERM_COLOR: always
  EPICS_BASE_VERSION: R7.0.8
  PVXS_VERSION: 1.3.3

jobs:
  # Cheap gate: decides whether the heavy interop job should run for a
  # PR. Its own result is not a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        # Same wire-shape / interop test sources the trigger used to
        # gate on. Keep in sync with the paths that actually affect
        # the interop profile.
        filters: |
          relevant:
            - 'crates/epics-ca-rs/src/codec.rs'
            - 'crates/epics-ca-rs/src/protocol.rs'
            - 'crates/epics-ca-rs/src/server/**'
            - 'crates/epics-ca-rs/tests/wire_golden*.rs'
            - 'crates/epics-ca-rs/tests/interop_*.rs'
            - 'crates/epics-ca-rs/tests/cases/**'
            - 'crates/epics-pva-rs/src/codec.rs'
            - 'crates/epics-pva-rs/src/proto/**'
            - 'crates/epics-pva-rs/src/pvdata/**'
            - 'crates/epics-pva-rs/src/server_native/**'
            - 'crates/epics-pva-rs/tests/wire_golden*.rs'
            - 'crates/epics-pva-rs/tests/interop_*.rs'
            - 'crates/epics-pva-rs/tests/pva_cases/**'
            - '.config/nextest.toml'
            - '.github/workflows/interop.yml'

  interop:
    needs: changes
    # Run the heavy suite when the PR touches interop-relevant paths,
    # or always for manual/scheduled runs. Otherwise this job is
    # skipped and reported as success (see the header note).
    if: ${{ needs.changes.outputs.relevant == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # ── Runner disk ────────────────────────────────────────────
    # This is the only job that holds three large trees at once: the
    # restored /opt/epics-base (~3 GB) and /opt/pvxs, plus a
    # `cargo build --workspace --tests` target dir for 149 crates. That
    # exceeded the ~14 GB an ubuntu-latest runner leaves free on `/`,
    # and the runner died mid-suite writing its own diagnostic log
    # ("System.IO.IOException: No space left on device") — which also
    # loses the job log, so the failure arrives with no test output at
    # all. Reclaim the preinstalled SDKs this job never uses; `df` is
    # printed so a recurrence is diagnosable from the log instead of a
    # runner crash annotation.
    - name: Reclaim runner disk
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/.ghcup /usr/share/swift \
                    /usr/local/share/powershell /usr/local/share/chromium
        df -h /

    - uses: actions/checkout@v4

    # ── Toolchain ──────────────────────────────────────────────
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest
    # Cargo registry + target cache, same shape as every job in
    # `rust.yml`. Placed after the toolchain step because the cache key
    # includes the rustc version. The explicit `key` names the *feature
    # resolution* this job builds — `cargo build --workspace --tests`
    # with default features — so it can never restore into a job that
    # resolves features differently. rust-cache also folds the job name
    # in, so this stays a separate entry from `rust.yml`'s `checks` job
    # even though both resolve default features: only this job's target
    # dir holds the gated interop test binaries.
    - uses: Swatinem/rust-cache@v2
      with:
        key: default-features

    # ── EPICS reference build ──────────────────────────────────
    # Cache /opt/epics across runs. Cache key bumps when version
    # changes. ~3 GB; full first-time build ~12 min, cache restore
    # ~30 s.
    - name: Restore epics-base cache
      id: cache-epics
      uses: actions/cache@v4
      with:
        path: /opt/epics-base
        key: epics-base-${{ env.EPICS_BASE_VERSION }}-ubuntu-latest

    - name: Build epics-base if cache miss
      if: steps.cache-epics.outputs.cache-hit != 'true'
      run: |
        sudo mkdir -p /opt/epics-base
        sudo chown $USER /opt/epics-base
        cd /tmp
        git clone --depth 1 --branch ${{ env.EPICS_BASE_VERSION }} \
          https://github.com/epics-base/epics-base.git
        cd epics-base
        make -j2
        cp -r . /opt/epics-base/

    - name: Restore pvxs cache
      id: cache-pvxs
      uses: actions/cache@v4
      with:
        path: /opt/pvxs
        # -v2: earlier cached trees could miss the libpvxs SONAME
        # symlinks, so pvx* failed with "libpvxs.so.1.3: cannot open
        # shared object file". Bump forces one clean rebuild.
        key: pvxs-${{ env.PVXS_VERSION }}-base-${{ env.EPICS_BASE_VERSION }}-ubuntu-latest-v2

    - name: Build pvxs if cache miss
      if: steps.cache-pvxs.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libevent-dev libssl-dev
        sudo mkdir -p /opt/pvxs
        sudo chown $USER /opt/pvxs
        cd /tmp
        git clone --depth 1 --branch ${{ env.PVXS_VERSION }} \
          https://github.com/epics-base/pvxs.git
        cd pvxs
        echo "EPICS_BASE=/opt/epics-base" > configure/RELEASE.local
        make -j2
        cp -r . /opt/pvxs/

    # ── PATH plumbing ──────────────────────────────────────────
    # Tests probe PATH for `softIoc`, `caget`, `pvget`, etc. Put
    # the EPICS host-arch bin dirs first so the tests find them.
    #
    # PVXS_HOME and EPICS_BASE are the other half. `interop_pvxs`
    # resolves both *source* checkouts through `epics_base_rs::reference`
    # (sentinels `src/clientreq.cpp` and
    # `modules/database/src/ioc/db/dbAccess.c`, which `cp -r .` puts
    # under /opt), and it is the only binary in `profile.interop` that
    # reads a reference tree — the four dedicated reference suites are
    # excluded from both `profile.ci` and `profile.interop`. Unset, the
    # resolvers used to fall back to `$HOME/codes/pvxs` and
    # `$HOME/epics/epics-base`, so the pvxs interop tests SKIPPED on CI
    # and nextest reported the skips as passes; they now panic instead,
    # which is what surfaced both gaps.
    - name: Add EPICS bin dirs to PATH
      run: |
        HOST_ARCH=$(ls /opt/epics-base/bin | head -n1)
        echo "/opt/epics-base/bin/${HOST_ARCH}" >> "$GITHUB_PATH"
        echo "/opt/pvxs/bin/${HOST_ARCH}" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/opt/epics-base/lib/${HOST_ARCH}:/opt/pvxs/lib/${HOST_ARCH}" \
          >> "$GITHUB_ENV"
        if [ ! -f /opt/pvxs/src/clientreq.cpp ]; then
          echo "::error::/opt/pvxs is not a pvxs source checkout — the cache holds an install prefix, not the tree interop_pvxs reads"
          exit 1
        fi
        echo "PVXS_HOME=/opt/pvxs" >> "$GITHUB_ENV"
        if [ ! -f /opt/epics-base/modules/database/src/ioc/db/dbAccess.c ]; then
          echo "::error::/opt/epics-base is not a base source checkout — the cache holds an install prefix, not the tree the C++ interop helpers build against"
          exit 1
        fi
        echo "EPICS_BASE=/opt/epics-base" >> "$GITHUB_ENV"

    # ── Dynamic-linker registration ────────────────────────────
    # The reference binaries link libpvxs.so.1.3 / libca.so by SONAME.
    # LD_LIBRARY_PATH set above reaches nextest's direct children, but a
    # reference binary spawned as a *grandchild* (test process ->
    # pvxget) is not guaranteed to inherit it. Register the lib dirs
    # with the system loader so SONAME resolution works regardless, and
    # fail loudly HERE (with a directory listing) if libpvxs is still
    # absent — that turns a broken cache into an obvious infra error
    # instead of 11 cryptic "cannot open shared object file" test fails.
    - name: Register EPICS/pvxs libs with ldconfig
      run: |
        HOST_ARCH=$(ls /opt/epics-base/bin | head -n1)
        echo "/opt/epics-base/lib/${HOST_ARCH}" | sudo tee /etc/ld.so.conf.d/epics.conf
        echo "/opt/pvxs/lib/${HOST_ARCH}" | sudo tee -a /etc/ld.so.conf.d/epics.conf
        sudo ldconfig
        if ! ldconfig -p | grep -q 'libpvxs\.so'; then
          echo "::error::libpvxs SONAME not registered — /opt/pvxs cache is incomplete"
          ls -l "/opt/pvxs/lib/${HOST_ARCH}" || true
          exit 1
        fi

    # ── Rust interop profile ───────────────────────────────────
    - name: Build workspace
      run: cargo build --workspace --tests

    - name: Run wire-golden + interop suites
      # The `interop` profile in .config/nextest.toml filters to
      # the gated binaries (wire_golden_ext, wire_golden_pvxs,
      # interop_*_rust_*, differential_libca, parity_interop,
      # interop_pvxs). Skips wrapped in `require_tool` print a
      # SKIP line + exit 0 when binaries are still missing.
      run: cargo nextest run --profile interop --no-fail-fast
