[workspace]
members = ["crates/*", "examples/*", "tools/*"]
default-members = [
    "crates/ad-core-rs",
    "crates/ad-plugins-rs",
    "crates/asyn-rs",
    "crates/epics-base-rs",
    "crates/epics-ca-rs",
    "crates/epics-macros-rs",
    "crates/epics-pva-rs",
    "crates/epics-bridge-rs",
    "crates/epics-rs",
    "crates/epics-libcom-rs",
    "crates/motor-rs",
    "crates/std-rs",
    "crates/scaler-rs",
    "crates/optics-rs",
    "crates/mca-rs",
    "crates/mqtt-rs",
    "crates/modbus-rs",
    "crates/epics-tools-rs",
    # The codegen drift gates live here as `#[test]`s. They are in
    # default-members so a BARE `cargo nextest run` catches a stale generated
    # table — a gate you have to remember to invoke is not a gate.
    "tools/dbd-codegen",
    "tools/env-codegen",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.25.0"
authors = ["Sang Woo Kim <sngwkim915@gmail.com>"]
license = "EPICS"
repository = "https://github.com/epics-rs/epics-rs"

[workspace.dependencies]
ad-core-rs = { path = "crates/ad-core-rs", version = "0.25.0" }
ad-plugins-rs = { path = "crates/ad-plugins-rs", version = "0.25.0" }
asyn-rs = { path = "crates/asyn-rs", version = "0.25.0" }
epics-base-rs = { path = "crates/epics-base-rs", version = "0.25.0" }
epics-ca-rs = { path = "crates/epics-ca-rs", version = "0.25.0" }
epics-macros-rs = { path = "crates/epics-macros-rs", version = "0.25.0" }
epics-rtems-boot = { path = "crates/epics-rtems-boot", version = "0.25.0" }
epics-libcom-rs = { path = "crates/epics-libcom-rs", version = "0.25.0" }
epics-pva-rs = { path = "crates/epics-pva-rs", version = "0.25.0" }
epics-bridge-rs = { path = "crates/epics-bridge-rs", version = "0.25.0" }
motor-rs = { path = "crates/motor-rs", version = "0.25.0" }
std-rs = { path = "crates/std-rs", version = "0.25.0" }
scaler-rs = { path = "crates/scaler-rs", version = "0.25.0" }
optics-rs = { path = "crates/optics-rs", version = "0.25.0" }
mca-rs = { path = "crates/mca-rs", version = "0.25.0" }
mqtt-rs = { path = "crates/mqtt-rs", version = "0.25.0" }
modbus-rs = { path = "crates/modbus-rs", version = "0.25.0", package = "epics-modbus-rs" }
epics-tools-rs = { path = "crates/epics-tools-rs", version = "0.25.0" }

# Deployable-image profile for the embedded targets (RTEMS / VxWorks), where
# image size is a real resource: `cargo build --profile release-embedded ...`
# reproduces row 5 of the measured matrix in `doc/vxworks-port.md` §5.5
# (vs `--release`+strip: CA −15.6/−18.9 %, PVA −19.7/−22.6 %; cold build ~2×).
# `release` itself is untouched, so host build times are unaffected.
[profile.release-embedded]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1


# RTEMS 6 (armv7-rtems-eabihf) needs libc definitions that the published crate
# does not yet carry: `time_t`/`clock_t`/`clockid_t`/`dev_t`/`ino_t`/`off_t`/
# `rlim_t` widths, the BSD length byte on every socket address struct, and the
# libbsd values of the socket/poll/getaddrinfo constants. `-Zbuild-std` compiles
# `std` against this same crate, so a wrong `timespec` or `sockaddr_in` corrupts
# std itself rather than only our code -- see the two build-refusing asserts in
# `crates/epics-rtems-boot/src/lib.rs` (`_RTEMS_LIBC_TIME_LAYOUT`,
# `_RTEMS_LIBC_SOCKET_LAYOUT`), which is why this is a patch and not a local
# type definition. `scripts/rtems-check.sh` fails all six `image` targets
# without it.
#
# Pinned by rev; the tag `epics-rs-rtems-0.2.188` on the same fork keeps that
# commit reachable. The branch is upstream `libc-0.2` (8c6e6710) plus four
# commits, split upstream as PRs `rtems-sockaddr-len` and `rtems-type-widths`.
# Remove this patch once those land in a published 0.2 release.
[patch.crates-io]
libc = { git = "https://github.com/physwkim/libc.git", rev = "6f64e70d6a2a03b989380aaa719207236343f093" }
