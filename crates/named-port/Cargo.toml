[package]
name = "named-port"
version.workspace = true
edition.workspace = true
description = "Test-only: retry a test that must NAME a port when the number it named was taken between the probe and the bind"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true
# Never published. Every consumer takes it as a `path`-only dev-dependency,
# which `cargo package` drops from the uploaded manifest, so this crate's
# absence from crates.io is not a hole in anyone's dependency graph.
publish = false

[dependencies]
socket2 = "0.5"

# `SO_EXCLUSIVEADDRUSE` on the held-port probe (socket2 does not expose it)
# and `WSAEACCES` in `held_by_another`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
