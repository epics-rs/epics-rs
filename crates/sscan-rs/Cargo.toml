[package]
name = "sscan-rs"
version.workspace = true
edition.workspace = true
description = "Rust port of the EPICS synApps sscan module (sscan and scanparm records)"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4"
epics-base-rs = { workspace = true }
epics-libcom-rs = { workspace = true }
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"

[features]

[dev-dependencies]
tempfile = "3"
epics-ca-rs = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
