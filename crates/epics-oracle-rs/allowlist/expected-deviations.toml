# Expected-deviation allowlist for the differential oracle.
#
# WHAT THIS IS
# Under the product policy adopted 2026-07-13 -- "C's bugs are not the contract.
# Clean is the goal." -- a difference between the C softIoc and the Rust port is
# NOT automatically a port bug. It is one of these things:
#
#   * a deliberate refusal to reproduce a C defect     -> EXPECTED DEVIATION
#   * an intentional port DESIGN divergence            -> EXPECTED DEVIATION
#   * a ground-truth INSTRUMENT superset artifact      -> EXPECTED DEVIATION
#   * a ground-truth INSTRUMENT that cannot be read    -> EXPECTED DEVIATION
#   * anything else                                     -> PORT DEFECT
#
# That policy has three tiers. Interoperability -- the CA and PVA wire protocols,
# DBR/DBF type codes, opcode framing, the .db/.dbd grammar -- admits no deviation
# at all; a C client must not be able to tell the difference. Semantics (record
# processing, alarms, monitor posting, link behaviour) match C where C is right
# and fix C where C is wrong, documenting the deviation and reporting it
# upstream: that second half is what this file records. Drivers and applications
# are held to correctness against hardware and simulators, never to parity with
# C source.
#
# THREE JUSTIFICATION BASES, FIVE BUCKETS
# Most rows are C-bug refusals. Each NOT-REPRODUCED (or, disabled, REPRODUCED)
# row MUST cite the CBUG id of the upstream defect it refuses to reproduce, and
# -- because this file is the record, not a pointer to one -- its `why` MUST
# itself name the C symbol, state what C does, why that is wrong, and what the
# port does instead. A row whose `why` does not stand up without the id is wrong.
#
# A DESIGN-DIVERGENCE row is different in kind: it records an INTENTIONAL port
# design choice that is neither a C-bug refusal nor a defect (e.g. lifting a
# fixed-capacity buffer cap and serving live length). The port deliberately does
# something other than the spec.
#
# An INSTRUMENT-SUPERSET row is the OPPOSITE direction: the port matches the
# measured spec, but the PVA ground-truth INSTRUMENT exceeds it. softIocPVX loads
# softIocPVX.dbd, a superset of the oracle's measured softIoc.dbd, so it serves
# extra menu choices (pvxs's own example device support) the shared spec never
# declares. The port is not pvxs and correctly serves the measured spec; the
# difference is the instrument's, not the port's.
#
# An INSTRUMENT-DEFECT row is the third instrument case, and the sharpest: the
# ground truth cannot be measured AT ALL, because reading the channel CRASHES the
# instrument. There is no C answer to compare the port against -- not a different
# answer, no answer -- so the row's `why` must name the upstream defect (project,
# file, line) that destroys the server. The finding is real and it is cited; it
# is simply charged to the project that owns the crash, not to the port.
#
# It is the one bucket that can legitimately be carried `enabled = false` on the
# strength of a defect that still EXISTS. A crash is not a property of a channel
# alone but of a channel and an allocation history, so an upstream heap overflow
# can be reproducible in isolation and yet never surface under the harness's own
# read sequence. Disabled, the row asserts nothing about this run and can never
# go stale; it is the citation waiting for the crash to come back. And if it does
# come back it comes back LOUD -- an abort with no enabled row justifying it is a
# DEFECT and fails the run -- so the row is a reference, never a suppression.
#
# DESIGN-DIVERGENCE, INSTRUMENT-SUPERSET and INSTRUMENT-DEFECT are justified by
# their `why` — the rationale stated in place — and cite NO CBUG. The CBUG
# requirement is relaxed for these three buckets only; every row still needs a
# non-empty, unique `id` (it keys the fired/stale ledger) and a non-empty `why`.
# Buckets are validated at load (allowlist.rs::parse); an unknown bucket string
# is a parse error, not a silent wildcard. All five buckets match, fire, and go
# stale by the same rules — the bucket changes only what justifies a row.
#
# SELF-CHECKING, IN BOTH DIRECTIONS
#   * a diff that matches a row      -> reported as EXPECTED DEVIATION, not a failure
#   * a diff that matches no row     -> reported as a PORT DEFECT
#   * a row that STOPS firing        -> reported as STALE. The deviation vanished.
#                                       Either the port regressed back onto C's
#                                       bug, or C fixed it upstream. Both are
#                                       findings; neither may pass silently.
#
# MATCHING
# A row fires when every constraint it states holds. Omitted constraints are
# wildcards, so a row is as narrow as it is written. `record_types` and `fields`
# are exact-match lists; `classes` matches the boundary class from cases.rs;
# `surface` matches which observation differed.
#
# SCOPE NOTE, stated rather than implied: most of the 76 NOT-REPRODUCED entries
# in the catalogue are Tier-3 (asyn, ADCore, motor, optics, modbus) or live
# inside the calc expression engines. They cannot fire on the record/field CA
# surface this harness drives, so they are deliberately NOT transcribed here --
# listing them would be padding, and a row that can never fire would be flagged
# STALE forever. Only entries reachable from a CA get/put on a base record
# field are listed. When the harness grows a calc-expression generator, the
# CBUG-A* / CBUG-C* / CBUG-F1..F5 rows become reachable and belong here.

schema = 1

# --------------------------------------------------------------------------
# Reachable today: base record/field CA surface.
# --------------------------------------------------------------------------

[[deviation]]
id = "CBUG-E1"
bucket = "NOT-REPRODUCED"
upstream = "epics-base / db"
record_types = ["compress"]
fields = ["VAL"]
surface = ["value_string", "value_numeric", "monitor_events"]
classes = ["array-into-non-empty"]
why = """
In C, a client dbPut into a compress record's VAL takes its array write offset from
get_array_info() (dbAccess.c:1355-1360), whose documented contract is the READ start
-- "the index of the first valid element" -- because it exists to serve dbGet. In
FIFO mode that is (off + nsam - nuse) % nsam, not the write cursor off, so the put
overwrites the oldest elements instead of appending after the newest. On an EMPTY
ring the two indices coincide and both agree; the divergence needs data in the ring.
Priming a NSAM=3 FIFO with (4,5) and then putting (7,8): C writes 7,8 over indices
0,1 and reads back [8,0,7], having overwritten the 4 it should have kept and left
the 5 stale in place. The port writes at the write cursor and reads back [5,7,8].
NUSE and OFF agree on both sides (3 and 1) -- put_array_info bumps NUSE on every
accepted put, and only the buffer contents differ.
Expect: C and port disagree on VAL contents after a put into a NON-empty compress
ring; an empty ring, NUSE and OFF all agree. That precondition is the `classes`
constraint, not prose: the divergence is only reachable from the array phase's
`array-into-non-empty` case, so a phase that reads VAL without priming it must
not count as having looked.
"""

[[deviation]]
id = "CBUG-E2"
bucket = "NOT-REPRODUCED"
upstream = "epics-base / dbConvert"
fields = []
# The row's scope is the DESTINATION type, not a place: dbConvert instantiates
# the same PUT macro body for every integer destination and for epicsEnum16, on
# every record type. A float/double destination takes no integer cast and is
# deliberately absent -- ai.VAL is DBF_DOUBLE, so `inf` vs `0` there is not this
# bug and stays a DEFECT until adjudicated on its own.
dbf_types = [
    "DBF_CHAR",
    "DBF_UCHAR",
    "DBF_SHORT",
    "DBF_USHORT",
    "DBF_LONG",
    "DBF_ULONG",
    "DBF_INT64",
    "DBF_UINT64",
    "DBF_ENUM",
    "DBF_MENU",
]
surface = ["value_string", "value_numeric"]
# `over-double-max`, `over-float-max` and `nan` are NOT here: cases.rs generates
# those three only for DBF_FLOAT/DBF_DOUBLE fields, which `dbf_types` excludes,
# so listing them would restate a scope the row does not have.
classes = ["over-max", "under-min", "enum-negative-ordinal"]
why = """
dbConvert's double->integer put is a bare C cast, which is UNDEFINED out of range
(C17 6.3.1.4p1) -- so compiled C is not single-valued. The C softIoc this harness
diffs against is x86-64, where cvttsd2si yields the integer indefinite
(3.0e9 -> INT_MIN, NaN -> INT_MIN); an aarch64 IOC's fcvtzs SATURATES on the same
input (3.0e9 -> INT_MAX, NaN -> 0). There is no single C answer to be faithful to.

Adjudicated 2026-07-14 (commit 651bf392): the port SATURATES and sends NaN to 0
(types::c_cast), which is byte-identical to a compiled aarch64 IOC. No alarm --
the stored value is in range and valid, and dbConvert runs outside the record's
process cycle where an alarm would be erased by the next recGblResetAlarms.

The epicsEnum16 (DBF_MENU/DBF_ENUM) destination is the same cast: `putDoubleEnum`
instantiates the identical PUT macro body, so a numeric ordinal put whose value is
out of the u16 range takes the same UB. `caput` sends a numeric-but-not-a-choice
value to an enum field as DBR_DOUBLE (caput.c:498-507), so `caput SCAN -1` reaches
`putDoubleEnum` as -1.0: the x86-64 softIoc stores the indefinite 65535, the port
saturates the negative double to 0 -- a valid menu ordinal (SCAN -> Passive,
PINI -> NO, a severity -> NO_ALARM). That is the `enum-negative-ordinal` class. Its
value-agreeing twin -- a negative ordinal into a *signed* raw field (PRIO's i16)
that holds -1 exactly -- produces no value diff and is not matched here. (An enum
put whose ordinal is IN u16 range but out of the record's menu range is NOT this
cast -- it is exact -- and is adjudicated separately, not under E2.)

Expect: on an out-of-range numeric put, the x86-64 C softIoc stores the indefinite
value and the port stores the saturated one. In range, both agree exactly.

Scope: the destination's declared DBF type (dbf_types above), because that is what
selects dbConvert's routine. A DBF_FLOAT or DBF_DOUBLE destination takes no integer
cast and nothing here justifies a difference on one.
"""

[[deviation]]
id = "CBUG-G1"
bucket = "NOT-REPRODUCED"
upstream = "pvxs / QSRV2"
record_types = ["asyn", "bo", "busy", "mbbiDirect", "mbboDirect", "sseq", "transform"]
fields = []
surface = ["value_marking", "seed_event"]
port_adds_leaves = ["display.precision"]
why = """
pvxs QSRV2 nests the display.precision assignment inside the DBR_GR_DOUBLE branch
(ioc/iocsource.cpp:288-292): a field that supplies get_precision but NULLs
get_graphic_double never gets its precision served over PVA, even though DBR_PRECISION
and DBR_GR_DOUBLE are independent rset slots and CA serves it. The seven record types
here are exactly the fat-dbd types whose rset supplies get_precision while NULLing
get_graphic_double (bo/mbbiDirect/mbboDirect in base; busy/asyn/transform/sseq in the
modules). The port declines to reproduce the drop -- nt::qsrv_marks::property_leaves
gates display.precision on its own DBR_PRECISION slot -- so the port's pvxget reply
carries a display.precision leaf that pvxs omits. Four of the seven types answer a
LITERAL on one field -- bo.HIGH = 2 (boHIGHprecision, boRecord.c:85),
busy.HIGH = 2 (busyRecord.c:281), transform.VERS = 2 (transformRecord.c:759),
asyn.TMOT = 4 (asynRecord.c:998) -- and every other field of every type takes the
recGblGetPrec default of 0. The value the port serves is the same one CA serves, so
this is PVA-vs-CA consistency, not a new number.

The same add shows on the monitor SEED (the initial full update carries the same
getProperties leaves), so the row covers both surfaces: value_marking (read) and
seed_event (monitor). transform.VAL is the one family VAL a monitor drives.

Content-constrained (port_adds_leaves): a case matches ONLY when the sole marking
difference is the port adding one or more display.precision lines pvxs omitted, with
nothing else on the channel changed or removed. Any other marking difference on these
types stays a DEFECT — e.g. mbboDirect.VAL's pre-existing seed/update difference is
not laundered.

Expect: on these types' numeric fields, the port's pvxget (and monitor seed) marks
display.precision and softIocPVX does not; the two renderings are otherwise identical.
"""

# --------------------------------------------------------------------------
# DESIGN-DIVERGENCE entries: intentional port design choices, justified by the
# `why` in place rather than by a CBUG. These match/fire/go-stale like any other
# row; they simply cite no upstream-bug catalogue entry.
# --------------------------------------------------------------------------

[[deviation]]
id = "DESIGN-ASYN-BOUT"
bucket = "DESIGN-DIVERGENCE"
upstream = "asyn / asynRecord"
record_types = ["asyn"]
fields = ["BOUT"]
surface = ["value_marking"]
why = """
asynRecord.dbd declares BOUT as DBF_CHAR special(SPC_DBADDR), a byte array whose
capacity C fixes at OMAX (initial 80) and whose write length is NOWT (initial
80). On a C IOC the field is a pre-sized 80-element buffer, so QSRV2 serves it
zero-filled at init: pvxget reads back epicsInt8_t[80] = {0,0,...} before
anything is written. The port declines to pre-size: it lifts the fixed 80-byte
OMAX cap and serves the ACTUAL written content, so an unwritten BOUT reads back
as an empty epicsInt8_t[0]. This is an intentional design choice, not a C-bug
refusal and not a port defect — the 80-element cap was a static asynRecord.dbd
sizing detail, and the port models the field as a live-length array instead.
There is no CBUG here: nothing on the C side is wrong, the two just made
different, defensible sizing decisions.

Matched on the PVA value/marking contract (pvxget), scoped to exactly asyn.BOUT.
The scope is field-level, so this row justifies only the BOUT length/content
difference and cannot launder a diff on any other asyn channel.

Expect: on ORACLE:ASYN.BOUT the C softIocPVX serves int8[]{80} (zero-filled to
the OMAX cap) and the port serves int8[]{0} (empty until written).
"""

[[deviation]]
id = "DESIGN-SCALCOUT-PREV-STRING-SCALAR"
bucket = "DESIGN-DIVERGENCE"
upstream = "calc / sCalcoutRecord (epics-modules/calc#42)"
record_types = ["scalcout"]
fields = ["PAA", "PBB", "PCC", "PDD", "PEE", "PFF", "PGG", "PHH", "PII", "PJJ", "PKK", "PLL"]
surface = ["declared_type", "value_marking"]
why = """
sCalcoutRecord's cvt_dbaddr, for fieldIndex scalcoutRecordPAA through
scalcoutRecordPLL, sets no_elements = STRING_SIZE (40) and then UNCONDITIONALLY
field_type = DBF_STRING, field_size = 1 -- so the released C IOC serves each
previous-string field as a 40-element DBF_STRING array whose advertised element
size is one byte (getStringString copies one byte per element and NUL-terminates
it). That shape is epics-modules/calc#42: the fields hold the previous cycle's
string inputs AA..LL, one scalar string each, and anjohnson's fix makes them
plain read-only DBF_STRING scalars -- special(SPC_NOMOD), no
extra()/special(SPC_DBADDR). The port serves that fixed shape ahead of the
upstream merge: ScalcoutRecord::prev_str_channel returns a scalar String read to
the NUL and field_no_mod raises SPC_NOMOD, so pvxinfo declares an NTScalar
string and pvxget reads the scalar value, where the C side declares and serves a
40-element string array. This is an intentional design divergence, not a port
defect. It will vanish the day calc#42 lands in the reference tree, at which
point the row goes STALE and must be deleted.

Matched on the PVA declared-type (pvxinfo) and value/marking (pvxget) contracts,
scoped to exactly scalcout PAA..PLL. The two shape contracts are not raised for
these fields -- the .dbd marks them special(SPC_DBADDR), so NtShape::expected
declines to predict -- so declared_type and value_marking are the whole surface
of this deviation.

Expect: on ORACLE:SCALCOUT.PAA..PLL the C softIocPVX declares and serves a
40-element DBF_STRING array, and the port declares and serves a scalar read-only
DBF_STRING.
"""

