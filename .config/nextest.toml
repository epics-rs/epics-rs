# cargo-nextest configuration for the epics-rs workspace.
#
# Why this exists
# ───────────────
# nextest runs every test in its own process, plus several processes
# in parallel. That's much more concurrency than `cargo test` (which
# multiplexes tests as threads inside one binary). For most tests it's
# a strict win — full default-suite runtime drops from ~30 s to ~8 s.
#
# But our integration suites that bind real network listeners
# (PvaServer / softIoc / mshim-rs) need throttled concurrency to avoid
# port-allocation races between simultaneous test processes. Group
# definitions below cap their max-threads.
#
# Conventions
# ───────────
# - `pva_listener`    — any test that opens a `PvaServer::isolated()` or
#   binds an ephemeral PVA port. Capped at 1 parallel process.
# - `ca_softioc`      — spawns an IOC and is serialised.
# - `ioc_unthrottled` — spawns an IOC and has been measured not to need
#   serialising. Uncapped, but *declared*: see below.
# - `ndarray_io`      — file_magick tests in `ad-plugins-rs` that read /
#   write tempfile-backed image fixtures. Capped at 1 because
#   `tempfile` collisions surface as PNG decode errors.
#
# The two IOC groups are complete by construction
# ───────────────────────────────────────────────
# `ca_softioc` used to be four binary names that somebody remembered to
# add. `epics-oracle-rs` spawns three kinds of IOC across eighty-odd
# tests and was never in it; neither were `interop_pvxs` or the six
# binaries that spawn `softioc-rs`,
# `realtime-ca-ioc`, `realtime-pva-ioc` and `qsrv-ioc`. Nothing went red
# when they joined — they just occasionally timed out under load, which
# reads as flakiness rather than as a missing declaration.
#
# `tools/ioc-spawn-gate` now derives the membership from the sources: it
# scans every workspace crate for a file that both names an IOC
# executable and spawns a process, maps it to the nextest binary that
# owns it, and FAILS if that binary is in neither IOC group under
# `default`, `ci` or `interop`. So a new IOC-spawning test binary is a
# red test on the commit that adds it. `cargo run -p ioc-spawn-gate
# --bin ioc-spawn-census` prints what the sources say.
#
# Two groups rather than one because "spawns an IOC" is derivable from
# the source and "needs serialising" is not. Forcing every spawner to
# `max-threads = 1` was measured, not assumed, and it is worse: capping
# `package(epics-oracle-rs)` at 4 took its concurrent-run failure rate
# from 4-of-21 to 6-of-18 and its solo wall time from 12.9 s to 26.5 s.
# fix-db measured the same for `interop_pvxs`: 3 of 20 failures with a
# single test alone in the run on an idle 96-CPU host, so its failures
# are not a concurrency effect either. The gate therefore insists that
# somebody decided, in this file, not that the cap is applied.
#
# Apply via `[[profile.default.overrides]]` blocks below.
#
# Tip: a one-off `cargo nextest run --no-fail-fast --retries 2` is the
# recommended dev loop — flaky integration suites still occasionally
# need a retry under unusual load.

[profile.default]
# Stop after the first 5 failures in a default run so a regression
# storm in one binary doesn't drown other failures' output.
fail-fast = true
# Per-test soft timeout. A real bug surfaces in seconds; anything
# longer is worth flagging. Increase per-suite via overrides if you
# really need it.
slow-timeout = { period = "30s", terminate-after = 4 }
# Opt-in suites: heavy interop matrix + wire-golden hex comparisons
# are gated out of the default run. Either spawn external C tools
# (softIoc / pvget / pvput) needing an EPICS install on PATH, or
# add a noticeable runtime for "did the protocol bytes change?"
# checks the default dev loop doesn't need. Run with
# `cargo nextest run --profile interop`, or `--profile ci` for the
# whole matrix. New suites pick up the gate by file-name convention.
default-filter = """
  not (
    binary(interop_c_client_rust_ioc) |
    binary(interop_rust_client_c_ioc) |
    binary(differential_libca) |
    binary(stress_load) |
    binary(wire_golden_pvxs) |
    binary(wire_golden_ext) |
    binary(interop_pvxs)
  )
"""

# Opt-in profile for the gated interop / wire-golden suites. Flips the
# default-filter so only the gated suites run; the per-binary
# parallelism caps below still apply, because nextest reads a profile's
# own overrides first and then the default profile's — `cargo nextest
# show-config test-groups --profile interop` attributes a gated binary
# to an "override for default profile", which is that rule in action.
# Use `cargo nextest run --profile interop`.
[profile.interop]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }
default-filter = """
  binary(interop_c_client_rust_ioc) |
  binary(interop_rust_client_c_ioc) |
  binary(differential_libca) |
  binary(wire_golden_pvxs) |
  binary(wire_golden_ext) |
  binary(interop_pvxs) |
  binary(discovery_mdns) |
  binary(attributes_file_over_ca) |
  binary(stress_load) |
  binary(calink_rights_match_softioc) |
  binary(local_cp_link_matches_softioc) |
  binary(gw_upstream_unresponsive_window) |
  (package(c-ca-tools) & test(=tests::a_held_udp_port_spends_the_candidate)) |
  (package(epics-pva-rs) & test(/^auth::tls::tests::(pkcs12_loads_leaf_and_key_with_password|pkcs12_wrong_password_is_rejected|pkcs12_with_ca_chain_splits_leaf_from_ca|pkcs12_pbes2_openssl3_default_loads_leaf_and_key|pkcs12_pbes2_with_ca_chain_splits_leaf_from_ca|pkcs12_pbes2_wrong_password_is_rejected|server_config_loads_from_pkcs12_env|server_default_requests_client_cert|server_config_inline_keychain_password_splits_at_semicolon|server_config_inline_keychain_password_beats_env_fallback|server_config_pkcs12_wrong_password_env_errors|server_honors_pvas_only_tls_options_require|server_falls_back_to_shared_pva_keychain)$/))
"""

# CI profile: friendlier output + retries for the genuinely flaky
# integration suites. Use via `cargo nextest run --profile ci`.
#
# Its default-filter repeats profile.default's list and adds the suites that
# read an upstream C/C++ reference checkout. Those fail loudly (by design)
# without the tree — `epics_base_rs::reference` panics rather than skipping,
# because a skip reports as a pass — and no cross-platform runner provisions
# one. Excluded here, not silenced: they still run locally and on any runner
# where the tree exists.
#
# `package(epics-oracle-rs)` is in that list for the same reason and belongs
# here rather than on the command line. The whole crate is a differential
# harness against a built C EPICS and pvxs: `CTools::discover`,
# `PvxTools::discover` and `CTools::dbd_path` are its only doors to the
# reference tree, and each of them errors rather than skipping. Naming it as
# `--exclude epics-oracle-rs` per workflow row made the rule a flag three rows
# remembered and a fourth did not, which is how a workspace run on the exec
# backend came back with ten of these panics. The rows keep the flag — it also
# skips *building* the crate, which the filter does not — but the guarantee is
# here, so a new workspace-wide row cannot lose it.
#
# The three FIFO pins are in it by name: each needs a process that may have
# SCHED_FIFO (root or RLIMIT_RTPRIO > 0) and fails without one, which a hosted
# runner never is. Their RT-off halves deny or skip SCHED_FIFO and run here.
#
# Keep the two lists in step: an addition to profile.default's list belongs
# here too, or CI silently runs a suite the default loop does not. (The
# test-group overrides used to be duplicated here for the same reason and no
# longer are — a profile inherits the default profile's overrides, so the copy
# was a second list to keep in step for no gain.)
#
# INVARIANT: every `cargo nextest run` in `.github/workflows/` passes
# `--profile ci` (or `--profile interop`, whose filter is an allow-list of
# interop binaries). None may run on `profile.default` — that is the dev-loop
# profile, and it deliberately does NOT exclude the reference-tree suites
# because locally the checkout exists and a silent skip there is the bug this
# whole arrangement was built to stop. A CI job left on the default profile
# fails on `reference.rs`'s panic instead, which is how linux-rt and
# rtems-exec-model were caught.
#
# One rule, not a list: a test binary that reads a reference tree is named
# `reference_*`, and `binary(/^reference_/)` excludes them all. The
# `epics-base-rs` test `reference_consumers_are_named_reference` fails a
# top-level test file that calls the resolver under any other name.
[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "60s", terminate-after = 4 }
status-level = "retry"
final-status-level = "flaky"
default-filter = """
  not (
    binary(interop_c_client_rust_ioc) |
    binary(interop_rust_client_c_ioc) |
    binary(differential_libca) |
    binary(stress_load) |
    binary(wire_golden_pvxs) |
    binary(wire_golden_ext) |
    binary(interop_pvxs) |
    binary(/^reference_/) |
    package(epics-oracle-rs) |
    (binary(rt_priority_default) & test(=the_default_gets_fifo_where_the_process_may_have_it)) |
    (package(epics-libcom-rs) & test(=runtime::task::tests::an_above_99_priority_is_refused_by_the_fifo_scheduler)) |
    (package(asyn-rs) & test(=runtime::port::tests::a_refused_port_thread_fails_registration))
  )
"""

# Test groups — cap per-group parallelism to match the resource the
# group contends on (network ports, env vars, tempfiles).
#
# Order matters: nextest resolves per-test overrides first-match-wins, so
# a binary named by two blocks belongs to whichever comes first.
# tools/ioc-spawn-gate accepts a `pva_listener` claim as a declaration;
# what it refuses is a spawner in no group at all.

# Unrelated to the IOC groups below: `ad-plugins-rs` appears in no other
# filter, so first-match-wins puts nothing else at stake in its position.
# It used to be pinned last because tools/ioc-spawn-gate could not read a
# `test()` term and treated the block as possibly claiming any binary; the
# gate now reads it as narrowing, which no whole-binary declaration is.
[[profile.default.overrides]]
filter = 'package(ad-plugins-rs) and test(file_magick::)'
test-group = 'ndarray_io'

[[profile.default.overrides]]
filter = 'binary(stability) | binary(tls) | binary(typed_nt) | binary(service_framework) | binary(pva_gateway) | binary(set_byte_order_renegotiate) | binary(heartbeat_echo) | binary(run_pva_ioc_env_ports)'
test-group = 'pva_listener'

# Serialised IOC spawners. These four are the group's original membership
# and stay capped: removing a cap is a measurement nobody has made, and
# `interop_rust_client_c_ioc` additionally calls `std::env::set_var` on
# `EPICS_CA_SERVER_PORT` (tests/interop_rust_client_c_ioc.rs:46-48).
# Note the group's old stated reason — "softIoc spawns share
# EPICS_CA_SERVER_PORT globally" — does not hold: every spawn site passes
# the port per child with `cmd.env(...)` on an ephemeral number, and
# nextest gives each test its own process, so the `set_var` above is
# confined to one test too. The cap is retained on the evidence of the
# runs behind it, not on that reason.
[[profile.default.overrides]]
filter = 'binary(interop_rust_client_c_ioc) | binary(interop_c_client_rust_ioc) | binary(stress_load) | binary(differential_libca) | binary(calink_rights_match_softioc) | binary(local_cp_link_matches_softioc)'
test-group = 'ca_softioc'

# IOC spawners that have been measured NOT to need serialising. Declared
# rather than capped, so tools/ioc-spawn-gate can tell "decided" from
# "nobody noticed". `package()` where the whole package is IOC machinery,
# so a new binary there is covered by construction; exact `binary()`
# names elsewhere, so a new IOC-spawning binary in those crates goes red
# instead of being silently absorbed.
#
#   package(epics-oracle-rs)           — the C/Rust/pvxs differential
#                                        harness; capping it measured
#                                        worse (see the header).
#   package(qsrv-ioc)                  — the example IOC's own tests.
#   binary(realtime_ca_ioc_boots)      — one boot each, ephemeral ports
#   binary(realtime_pva_ioc_boots)       taken by binding (`--port 0` /
#   binary(cli_tcp_port_fallback)        `free_*_port`), nothing shared.
#   binary(cli_monitor_disconnect_stderr)
#   binary(cli_monitor_separator)
#   binary(cli_env_double_diagnostics)
#   binary(softioc_default_is_interactive)
#   binary(softioc_verbose_brackets_the_script_and_iocinit)
#                                      — the two arms that load a
#                                        database take `--port 0`;
#                                        the third never calls
#                                        `iocInit`, so it opens no
#                                        socket at all. Every child
#                                        ends at stdin EOF.
#                                      — 0 failures in 20 runs at host load
#                                        58-62; every child takes an
#                                        ephemeral port with `--port 0` and
#                                        the serving arm waits on the
#                                        server's own announcement rather
#                                        than on a clock.
#   binary(softioc_boot_stream_split)  — 0 failures in 20 runs; one child,
#                                        its CA and repeater ports taken
#                                        by binding, ending at stdin EOF.
#   package(c-ca-tools)                — the softIoc spawner the
#                                        epics-ca-rs suites share; it has
#                                        no tests of its own.
#   binary(softioc_resolves_a_ca_link) — 0 failures in 20 runs, 10 at a
#                                        time at host load 35; each child
#                                        serves and searches its own
#                                        ephemeral port on 127.0.0.1.
#   binary(softioc_db_channel_create_line)
#                                      — 0 failures in 20 runs at host
#                                        load 34; the child serves its own
#                                        free port on 127.0.0.1.
#   binary(softioc_iocinit_line_precedes_init_record)
#                                      — 0 failures in 20 runs at host
#                                        load 10-19; `--port 0`, and the
#                                        child ends at stdin EOF.
#   binary(softioc_pini_order)         — 0 failures in 20 runs at host
#                                        load 13-19; `--port 0`, and the
#                                        child ends at stdin EOF.
#   binary(events_per_chan_clamp_is_reported_at_server_start)
#                                      — 0 failures in 20 runs, 6 at a
#                                        time at host load 47-60; `--port
#                                        0`, and each child ends at stdin
#                                        EOF.
#   binary(qsrv_rs_group_file)         — 0 failures in 20 runs, 2 at a
#                                        time at host load 13-20; each
#                                        child takes `--port 0` and
#                                        `EPICS_PVAS_BROADCAST_PORT=0`
#                                        and is waited on by its own
#                                        `iocRun` line.
#   binary(qsrv_rs_sources)            — 0 failures in 20 runs, 2 at a
#                                        time at host load 10-13; the
#                                        child's port is bound-and-released
#                                        by the test, the client retries.
#   binary(qsrv_rs_resolves_a_ca_link)
#   binary(qsrv_rs_resolves_a_pva_link)
#                                      — 0 failures in 20 runs, 2 at a
#                                        time at host load 4-8; the same
#                                        `qsrv_named_ports` helper, which
#                                        retries a lost port.
#   binary(softioc_ioc_init_starts_scanning)
#   binary(softioc_prompt_ioc_init_starts_the_ca_server)
#                                      — 0 failures in 20 runs, 5 at a
#                                        time at host load 23-26; the
#                                        first takes port 0, the second a
#                                        named port it retries when taken.
#                                        Every child ends at stdin EOF.
#   binary(interop_pvxs)               — fix-db measured 3 failures in 20
#                                        runs with ONE test alone in the
#                                        run on an idle host: not a
#                                        concurrency effect, so a cap
#                                        would cost wall time and buy
#                                        nothing.
[[profile.default.overrides]]
filter = 'package(epics-oracle-rs) | package(qsrv-ioc) | package(c-ca-tools) | binary(realtime_ca_ioc_boots) | binary(realtime_pva_ioc_boots) | binary(cli_tcp_port_fallback) | binary(cli_monitor_disconnect_stderr) | binary(cli_monitor_separator) | binary(cli_env_double_diagnostics) | binary(softioc_default_is_interactive) | binary(softioc_verbose_brackets_the_script_and_iocinit) | binary(softioc_resolves_a_ca_link) | binary(softioc_db_channel_create_line) | binary(qsrv_rs_group_file) | binary(qsrv_rs_sources) | binary(qsrv_rs_resolves_a_ca_link) | binary(qsrv_rs_resolves_a_pva_link) | binary(interop_pvxs) | binary(softioc_boot_stream_split) | binary(softioc_iocinit_line_precedes_init_record) | binary(softioc_pini_order) | binary(events_per_chan_clamp_is_reported_at_server_start) | binary(softioc_ioc_init_starts_scanning) | binary(softioc_prompt_ioc_init_starts_the_ca_server)'
test-group = 'ioc_unthrottled'

# Capped because nobody has measured them unthrottled.
[[profile.default.overrides]]
filter = 'binary(boot_stderr_matches_softioc) | binary(softioc_a_ca_put_never_waits_on_the_console) | binary(softioc_errlog_reports_lost_messages) | binary(softioc_undeclared_json_link_type) | binary(a_ca_forward_link_processes_the_remote_record) | binary(gw_upstream_unresponsive_window) | binary(softioc_db_path_bytes) | binary(qsrv_rs_db_path_bytes) | binary(st_cmd_boots_through_iocinit) | binary(attributes_file_over_ca) | binary(softioc_asub_init_stderr) | binary(softioc_ioc_init_failure_lines) | binary(softioc_ioc_init_redirect) | binary(softioc_general_time_dtyp) | binary(softioc_dbd_device_line)'
test-group = 'ca_softioc'

# epics-bridge-rs lib tests: two pvalink tests spawn softIocPVX (interop
# profile only) — 0 failures in 20 runs, 2 at a time at host load 38-193.
# A lib binary is declared only by `package()`, so this block sits after
# every block naming a bridge binary and first-match leaves those where
# they are.
[[profile.default.overrides]]
filter = 'package(epics-bridge-rs)'
test-group = 'ioc_unthrottled'

[test-groups]
# PVA listener-binding tests serialise process-wide. With max-threads
# higher than 1 we observed flakes in `stability` (auto-reconnect,
# channel-coalescing, pipeline) when several PVA
# servers raced against each other's UDP responder + beacon emitter.
# Locking to 1 still gives ~3× nextest speedup over `cargo test`
# because dispatch + per-test setup is faster than the thread-pool
# variant inside a single binary.
pva_listener = { max-threads = 1 }
# IOC spawners that are serialised. See the override block above for why
# these four and not the other ten.
ca_softioc = { max-threads = 1 }
# IOC spawners that are not. `num-cpus` is the scheduler's own ceiling,
# so membership here changes no scheduling — it records a decision and
# gives tools/ioc-spawn-gate something to check against.
ioc_unthrottled = { max-threads = "num-cpus" }
# tempfile / PNG fixture collisions surface as decode errors.
ndarray_io = { max-threads = 1 }
