name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Line tables, not full DWARF. A `cargo nextest run --workspace` target dir
  # for this workspace measures 91,635 MB here, against the ~86 GB an
  # ubuntu-latest runner leaves free, and it is nearly all debuginfo: 658 test
  # binaries at ~300 MB each. Both `checks` and `interop` died writing the
  # runner's own diagnostic log ("System.IO.IOException: No space left on
  # device"), which also loses the job log, so the failure arrives with no
  # output to read. `line-tables-only` keeps the file:line a backtrace is read
  # with and takes the same target dir to 34,436 MB (measured 2026-08-29).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
        components: rustfmt, clippy
    - uses: taiki-e/install-action@nextest
    - name: Format
      run: cargo fmt --all -- --check
    # Cargo registry + target cache. Placed after the toolchain step
    # because the cache key includes the rustc version. The explicit
    # `key` names the *feature resolution* this job builds: each job in
    # this file resolves features differently, so their target dirs are
    # not interchangeable and must not share a cache entry.
    - uses: Swatinem/rust-cache@v2
      with:
        key: default-features
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Build
      run: cargo build --workspace --verbose
    # epics-oracle-rs is a local differential harness: its tests boot the
    # compiled C `softIoc` for ground truth and fail loudly (by design) when
    # the C EPICS tree is absent, which it always is on a CI runner. It is
    # excluded from CI here — not silenced — and still runs locally where the
    # tree exists.
    - name: Run tests (nextest)
      run: cargo nextest run --profile ci --workspace --exclude epics-oracle-rs
    - name: Run doctests
      run: cargo test --doc --workspace

  # Code behind a non-default feature has NO tests in the `checks` job above:
  # `--all-targets` compiles the cfg'd-out module or test file away, so a
  # broken call site inside it is invisible and reads as green.
  #
  # ITS OWN JOB, BECAUSE A JOB IS WHAT OWNS A DISK. This used to be a step in
  # `checks`, looping `cargo nextest run -p <pkg> --features <feat>` over every
  # (package, feature) pair the manifests declare. Each pair is a distinct
  # feature resolution of the dependency graph and cargo evicts none of them:
  # measured at +1,124 MB per pair on top of the 34,436 MB the job's own
  # workspace resolution already holds, 53 pairs overran the ~86 GB an
  # ubuntu-latest runner has free and the runner died writing its own log.
  # Splitting the resolution off gets it a whole runner rather than the
  # remainder of one.
  #
  # TWO ROWS, BECAUSE THEY ANSWER DIFFERENT QUESTIONS.
  #
  # The first RUNS the gated code. `--workspace --all-features` is one
  # resolution in which every `#[cfg(feature = ...)]` block in the workspace is
  # compiled and its tests executed — strictly more than the old loop, which
  # ran only the tests of the one package each pair named.
  #
  # The second is `cargo check`, not `nextest`, and that is deliberate: what it
  # answers is whether a feature resolves ON ITS OWN, which `--all-features`
  # cannot see (a missing `a = ["b"]` in a manifest is invisible when `b` is on
  # anyway). Compiling is the whole question there, and `cargo check` costs
  # +362 MB per pair against nextest's +2,366 MB, so all 53 fit beside the
  # all-features resolution. This is also the exact form all 53 were verified
  # in on 2026-08-25.
  #
  # The pair list is derived from the manifests, never hand-kept: every feature
  # a workspace crate declares that its own `default` does not pull in.
  # `default` itself is excluded because a default feature list never names
  # itself, so the "not already in default" test would let the literal string
  # through. A hand-kept list had omitted `epics-modbus-rs` (167 tests) and
  # `mqtt-rs` (111), and a hand-kept *feature* half enrolled a crate only if
  # the feature happened to be spelled `ioc` or `epics` — which missed
  # `epics-base-rs/tests/client_server.rs` (`#![cfg(feature =
  # "ca-server-tls-test")]`) entirely, letting an `E0308` in it survive from
  # before 70b4a74b until 0909e7cb.
  all-features:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest
    - uses: Swatinem/rust-cache@v2
      with:
        key: all-features
    # epics-oracle-rs boots the compiled C `softIoc` for ground truth and fails
    # loudly (by design) without the C EPICS tree, which no runner has.
    - name: Every feature-gated test, compiled and run
      run: cargo nextest run --profile ci --workspace --all-features --exclude epics-oracle-rs
    - name: Every feature also resolves on its own
      run: |
        set -euo pipefail
        cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] as $p
                   | ($p.features | keys[]) as $f
                   | select($f != "default")
                   | select((($p.features.default // []) | index($f)) | not)
                   | "\($p.name) \($f)"' \
          | sort -u \
          | while read -r pkg feat; do
              echo "::group::$pkg --features $feat"
              cargo check -p "$pkg" --features "$feat" --all-targets
              echo "::endgroup::"
            done

  # The exec backend is a different *backend*, not an extra file: it routes the
  # `runtime::task` seam off the tokio reactor onto the std-thread background
  # executor — the backend the RTEMS build actually runs. The `checks` job above
  # builds only the hosted backend, so nothing there compiles, let alone
  # exercises, this one. Every exec-backend regression found so far (scan
  # ownership, group drain starvation, gateway spawns) was caught by hand. This
  # job is the standing gate.
  #
  # ONE ROW, NOT FIVE. While the backend was a cargo feature this job listed the
  # five crates that declared it, one `-p <crate> --features rtems-exec-model`
  # step each, because a feature is resolved per package: `-p epics-ca-rs` alone
  # left `epics-libcom-rs`'s own census uncompiled, and a partial forward built
  # the split state the `HAS_TOKIO_REACTOR` const guard refuses.
  # `EPICS_RS_BUILD_EXEC_BACKEND` is read by all 23 build scripts directly, so
  # there is no forwarding graph to get wrong and no reason to name crates: the
  # whole workspace resolves on one backend, which is the configuration a
  # deployment actually builds.
  # THE VARIABLE IS NAMED ONCE, AT JOB SCOPE, AND THE FIRST STEP PROVES IT TOOK
  #
  # A misspelled variable NAME is indistinguishable from an unset one — it
  # selects the hosted backend, silently, which is the exact failure mode this
  # migration exists to remove and would be worse here than before: a green
  # job reporting on a backend it never built. So the name appears once, at
  # `env:` on the job rather than on each step, and the first step is a run
  # that CANNOT pass on the hosted backend. Every `tests/rtems_exec_model_gate.rs`
  # is `#![cfg(exec_backend)]`, so on the wrong backend nextest matches no test
  # and exits non-zero rather than reporting "0 passed".
  #
  # The doc row lives here too, for the same one-name reason. It was previously
  # covered by the `rustdoc` job's `--all-features` row, which turned on
  # `rtems-exec-model` and was therefore an exec-backend reading that documented
  # no `#[cfg(tokio_backend)]` item at all. That coverage was real and
  # accidental; `--all-features` is now the hosted backend like every other row,
  # so the reading has to be asked for.
  #
  # Clippy here is NOT a replacement for anything: no row in this workflow ever
  # ran clippy at `--all-features`, so the exec backend has never been linted in
  # CI. The five feature rows this job replaces compiled it at default lint
  # levels only.
  exec-backend:
    runs-on: ubuntu-latest

    env:
      EPICS_RS_BUILD_EXEC_BACKEND: thread

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest
    - uses: Swatinem/rust-cache@v2
      with:
        key: exec-backend
    - name: The exec backend is what this job actually built
      run: cargo nextest run --profile ci --workspace -E 'binary(rtems_exec_model_gate)'
    - name: Workspace on the exec backend
      run: cargo nextest run --profile ci --workspace
    - name: Clippy on the exec backend
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: rustdoc on the exec backend, private items
      run: cargo doc --no-deps --keep-going --workspace --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    # Two rustdoc rows, because the `rustdoc` job's `--all-features` row used
    # to be this backend's: while the backend was a cargo feature it rode in
    # `--all-features`, so that row documented the exec backend and nothing
    # documented the hosted one. It documents the host now, so without this
    # step an item that exists only behind a feature would have no rustdoc row
    # on this backend at all.
    - name: rustdoc on the exec backend, all features, private items
      run: cargo doc --no-deps --keep-going --workspace --all-features --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    # `./scripts/rtems-check.sh` — the RTEMS *target* gate — runs in its own
    # `rtems-closure` job below, not here: it needs a nightly toolchain
    # (`-Zbuild-std`) while this job runs the pinned stable, and its feature
    # resolutions are per-crate RTEMS configurations, not this job's.

  # Type-checks the whole RTEMS closure — every RTEMS crate, binary, and both
  # build configurations (`portability` and `image`) — for armv7-rtems-eabihf.
  # Tier-3 target: nightly + rust-src + `-Zbuild-std`, but no cross-toolchain
  # and no BSP (type-check only, nothing is linked).
  #
  # History: this gate was deliberately excluded from CI while it was RED on
  # the committed tree — with a stock `libc` the image configuration cannot
  # build, by design (compile-time layout refusals). It went green when the
  # RTEMS `libc` fixes were pinned in the workspace `[patch.crates-io]`
  # (see Cargo.toml), so CI runners now resolve the same patched `libc` as a
  # local checkout and the exclusion reason is gone.
  #
  # The nightly channel floats on purpose. `scripts/rtems-tls-spec.sh` derives
  # the one-key `has-thread-local: true` spec deviation from the ACTIVE
  # nightly (doc/rtems-tls-spec-deviation.md) and REFUSES — turning this job
  # red — the moment upstream flips the key in the builtin spec, which is
  # exactly the retirement trip-wire the deviation doc requires. Pinning a
  # nightly here would mute that trip-wire and drift from what
  # `cargo +nightly` means on a developer machine.
  rtems-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    # The C half of the same target, and it runs BEFORE the toolchain install
    # because it needs none: `cc` and four seconds. `rtems-check.sh` below is a
    # `cargo check`, which never invokes `cc`, so until this step existed no job
    # in this repository compiled a single line of `crates/epics-rtems-boot/csrc`
    # — a change to the boot shim could not turn CI red. POSIX_Init is covered
    # here too, compiled for the host against the RTEMS declarations recorded in
    # `csrc/tests/rtems-api/`; what is still outside is `rtems_config.c` and
    # `rtems_stats.c`, and the script says why.
    - name: Compile and run the host-reachable boot shim sources
      run: ./scripts/csrc-check.sh
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        key: rtems-closure
    - name: Type-check the RTEMS closure
      run: ./scripts/rtems-check.sh

  # The VxWorks 7 counterpart of `rtems-closure`, and since the fork branch
  # `epics-rs-0.2` made the patched libc public, a full one: the same job
  # shape type-checks the whole VxWorks closure. `-Zbuild-std` compiles std
  # against rust-src's own `library/Cargo.lock`, which a workspace patch does
  # not reach, so `vxworks-check.sh` derives a CONFIG-level patch from the
  # manifest pin and passes it on its own command line; all this runner needs
  # is the same public `nightly` + `rust-src` the RTEMS job installs. The
  # linking half of the port still needs the proprietary Wind River SDK and
  # stays on the bring-up box, but linking was never this gate's claim.
  #
  # The census half needs no toolchain and catches the highest-value
  # regression class — a new `src/bin/*.rs` landing classified as neither a
  # target binary nor host-only, which is exactly how a target binary last
  # fell outside a gate. It runs first and unconditionally, so this job is
  # red both when a binary is unclassified and when the closure stops
  # compiling.
  #
  # `nightly` was unpinned here for the same trip-wire reason `rtems-closure`
  # gives — a nightly whose std needs libc API the pinned content lacks fails
  # loudly, the signal to rebase the fork. It is now PINNED to nightly-2026-08-30,
  # the last nightly before rust-lang/rust#160170 (merged 2026-08-30, first
  # shipped in nightly-2026-08-31) dropped the `not(target_os = "vxworks")` guard
  # around `libc::O_NOFOLLOW` in std's `set_perm_nofollow`. VxWorks libc defines
  # no `O_NOFOLLOW`, so from nightly-2026-08-31 on `-Zbuild-std` cannot compile
  # std for x86_64-wrs-vxworks at all. Lift the pin (back to floating `nightly`)
  # once rust-lang/rust#162065 — the std-side fix that returns `Unsupported` on
  # VxWorks — merges and reaches nightly.
  #
  # Two consequences while pinned: the floating trip-wire above no longer fires
  # in CI, so until the pin is lifted that check lives in a local
  # `VXWORKS_TOOLCHAIN=nightly ./scripts/vxworks-check.sh` run; and at the pin
  # itself the closure compiles against stock rust-src libc (`--locked`, no
  # derived std patch), so the std graph here no longer leans on the fork.
  # `VXWORKS_TOOLCHAIN` names the same dated nightly for the script, since a
  # dated toolchain is not the bare `nightly` its patch-derivation keys on.
  vxworks-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-30
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        key: vxworks-census
    - name: Census, then type-check the VxWorks closure
      run: ./scripts/vxworks-check.sh
      env:
        VXWORKS_TOOLCHAIN: nightly-2026-08-30

  # `linux-rt` swaps `PriorityInheritanceMutex` from the parking_lot fallback
  # onto a real `PTHREAD_PRIO_INHERIT` pthread mutex
  # (crates/epics-libcom-rs/src/runtime/sync.rs). No other job turns the
  # feature on, so without this job the PI implementation would compile and
  # test only on maintainer machines. The two crates below are the ones that
  # declare (`epics-libcom-rs`) or forward (`epics-base-rs`) the feature.
  # No RT kernel is needed to *run* PI mutexes — only to measure their
  # latency effect, which happens off-CI (doc/rtlinux-rt-measurement.md).
  linux-rt:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest
    - uses: Swatinem/rust-cache@v2
      with:
        key: linux-rt
    - name: epics-libcom-rs (linux-rt)
      run: cargo nextest run --profile ci -p epics-libcom-rs --features linux-rt
    - name: epics-base-rs (linux-rt)
      run: cargo nextest run --profile ci -p epics-base-rs --features linux-rt

  # Commit b7a6b0ab found the no-default-features debt was three masked *build
  # breaks*, not warnings — code that simply does not compile once the default
  # features come off, invisible to every other job here because they all build
  # with defaults on. Those are fixed; this job is what keeps them fixed.
  #
  # `check`, not `build`/`nextest`: the failure mode being gated is compilation
  # under a feature resolution nobody exercises locally, and a type-check catches
  # all three of the breaks b7a6b0ab found at a fraction of the cost.
  #
  # `--all-targets` because without it the job sees libraries only, and the same
  # debt reappeared in `tests/`: three asyn-rs integration tests were
  # auto-discovered rather than declared with `required-features = ["epics"]`,
  # so cargo compiled them against an `epics_base_rs` the configuration does not
  # have. asyn-rs is the crate whose declared embedded configuration IS the
  # empty feature selection (`scripts/rtems-check.sh`), so that break was real
  # and this job was the gate that should have held it.
  no-default-features:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: Swatinem/rust-cache@v2
      with:
        key: no-default-features
    - name: Check (no default features)
      run: cargo check --workspace --no-default-features --all-targets

  # Every job above runs each test exactly ONCE, and that is the hole two
  # exec-backend defects walked through: `cancel_is_a_sync_point_resource_released`
  # (fixed by 96b0d3fb) and `cancel_after_completion_reports_not_active` (fixed by
  # 5d5e5b04). Both were probabilistic and feature-ON only — measured on the
  # defective tree at 3-5 failures per 50 runs and 2-5 per 50 respectively. A
  # single-run gate sees such a defect with probability ~1/25 and reports green
  # the other ~96% of the time, which is exactly what happened: the fixes came
  # from hand-repetition, not from CI.
  #
  # This job gates the CLASS, not those two names. It repeats the whole
  # cancel/termination test module, whose members all turn on the same
  # abort-versus-drop ordering the two defects lived in.
  #
  # Why 50 iterations: for a per-run failure probability p, N clean iterations
  # miss the defect with probability (1-p)^N. At the lower end of the measured
  # band, p = 2/50 = 1/25:
  #     N=10 → 0.96^10 = 0.66 (34% detection — worse than useless)
  #     N=25 → 0.96^25 = 0.36 (64%)
  #     N=50 → 0.96^50 = 0.13 (>85% detection)
  # 50 is the smallest round count clearing 85% at the weakest reproducer's
  # rate; the stronger one (5/50) is caught >99% of the time at that N. The
  # module runs in ~1 s, so 50 iterations cost under two minutes.
  #
  # Why a shell loop: cargo-nextest has no repeat-until-N-runs mode for PASSING
  # tests. `--retries` only re-runs tests that already failed, which is the
  # opposite of what a flake hunt needs. `--retries 0` is passed explicitly so
  # this job can never inherit a retrying profile — a retry would convert the
  # red iteration this gate exists to produce back into a green run.
  exec-backend-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest
    - uses: Swatinem/rust-cache@v2
      with:
        key: exec-backend-stress
    # Compile once up front so a build break reports as a build break rather
    # than as "iteration 1 failed".
    - name: Build test binary (exec backend)
      run: cargo build -p epics-pva-rs --lib --tests
      env:
        EPICS_RS_BUILD_EXEC_BACKEND: thread
    - name: Stress cancel/termination tests, 50 iterations (exec backend ON)
      run: |
        set -u
        iterations=50
        for i in $(seq 1 "$iterations"); do
          echo "::group::iteration $i/$iterations"
          if ! EPICS_RS_BUILD_EXEC_BACKEND=thread \
               cargo nextest run --profile ci -p epics-pva-rs \
               --lib --retries 0 \
               -E 'test(/^client_native::operation::tests::/)'; then
            echo "::endgroup::"
            echo "::error::exec-backend stress FAILED on iteration $i of $iterations"
            exit 1
          fi
          echo "::endgroup::"
        done
        echo "exec-backend stress: $iterations/$iterations iterations green"

  # Nothing in this file ran `cargo doc` before this job, so every rustdoc lint
  # — `broken_intra_doc_links` above all — was advisory on a developer's
  # terminal and enforced nowhere. Four panels closed the accumulated
  # population by hand in one round; with no gate it regrows on the next
  # commit, which is what this job is for.
  #
  # WHY THE CRITERION IS `exit 0` AND NOT A WARNING COUNT
  #
  # Fixing one link lets rustdoc reach the items behind it and report what they
  # were hiding, so any single run's list is a surface, not a population:
  # epics-libcom-rs was cited at 8 warnings, measured at 13, and closed at 12
  # over repeated re-runs. Only "the command exited 0" is stable under that.
  #
  # WHY THREE ROWS AND NOT ONE
  #
  # A doc run under one feature resolution never sees a link that only compiles
  # under another. Measured across twelve configurations (default,
  # `rtems-exec-model`, `linux-rt`, both, `--all-features`,
  # `--no-default-features`, each with and without `--document-private-items`):
  # 353 distinct diagnostic sites in this workspace, and NO single
  # configuration reaches all of them. Exhaustive search over the twelve puts
  # the smallest covering set at two; the rows below cover all 353.
  #
  #   * `--all-features --document-private-items` — every cargo feature on.
  #     Reports 15 sites the other rows do not.
  #   * `--no-default-features --document-private-items` — every cargo feature
  #     off. Reports 19 the others do not: the `epics-bridge-rs` and
  #     `epics-tools-rs` lib docs are compiled only here.
  #   * `--document-private-items` at default features — reports 0 that the
  #     others miss TODAY, and is kept for a class that is not hypothetical:
  #     `--no-default-features` compiles the whole CA `client` module out of
  #     the second row.
  #
  # A FOURTH reading — the exec backend — is required and is NOT here: it runs
  # in the `exec-backend` job, where the variable that selects it is named once
  # and proven to have taken. `--all-features` used to turn on
  # `rtems-exec-model`, so the first row was an exec-backend reading that
  # documented no `#[cfg(tokio_backend)]` item at all; that coverage was real
  # and accidental, and the axis was invisible in this list. `--all-features` is
  # now the hosted backend like every other row here.
  #
  # DROPPED — 9 of the 12, each measured to contribute zero sites the rows
  # above do not already report: `rtems-exec-model`, `linux-rt` and the two
  # together (with and without `--document-private-items`, 6 rows);
  # `--all-features` and `--no-default-features` without private items (2);
  # and plain default features without private items (1). Every named feature
  # is a subset of what `--all-features` turns on, which is why dropping them
  # is a measurement and not a budget cut. The 9 were measured when
  # `rtems-exec-model` was still a feature and the exec-backend reading came in
  # through `--all-features`; the new row above restores that reading as its
  # own axis rather than inheriting it.
  #
  # `--document-private-items` on all three rows: private docs are what a
  # contributor reads, and turning it on takes the population from 191 sites
  # to 319.
  #
  # Target selection stays at cargo's default (lib + bins). `--examples` was
  # measured to add 0 sites, and `cargo doc` has no `--tests` flag at all — so
  # `crates/*/tests/**` is outside any rustdoc gate. Stated here rather than
  # left to be assumed.
  #
  # `--keep-going` so one broken crate does not hide the rest. It does not
  # change the exit status, which is the only thing this gate reads.
  #
  # THIS JOB IS RED THE DAY IT LANDS: the workspace-wide sweep that closes the
  # crates nobody has written yet is still in flight. The check is added ahead
  # of that sweep on purpose — a gate that arrives after the cleanup gates
  # nothing that has not already regrown.
  rustdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: Swatinem/rust-cache@v2
      with:
        key: rustdoc
    - name: rustdoc (--all-features, private items)
      run: cargo doc --no-deps --keep-going --workspace --all-features --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    - name: rustdoc (--no-default-features, private items)
      run: cargo doc --no-deps --keep-going --workspace --no-default-features --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    - name: rustdoc (default features, private items)
      run: cargo doc --no-deps --keep-going --workspace --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings


  # The host job above cannot see a link that only exists on an embedded
  # target, and that is not a small remainder: documenting the RTEMS closure
  # reports 120 sites, 51 of which NO host reading produces — not under any of
  # the twelve feature configurations, and not under the same six crates built
  # with the same per-crate features on the host either (that second control is
  # what separates "target-gated" from "a feature row the sweep missed"). They
  # are the docs of everything behind `epics_embedded_target`: the PVA
  # `server_native` blocking stack, the CA server's target stats, the socket
  # half of `epics-libcom-rs::net`, `epics-rtems-boot`. A host-only gate would
  # report green over all 51.
  #
  # No hardware and no BSP: `cargo doc` compiles metadata, exactly as the
  # `rtems-closure` and `vxworks-census` jobs' `cargo check` does, so this
  # needs the same nightly + rust-src and nothing more.
  #
  # WHY RTEMS RUNS WITH `RTEMS_USE_STOCK_SPEC=1`
  #
  # `.cargo/config.toml` reroutes `--target armv7-rtems-eabihf` through the
  # generated has-thread-local spec using `build.rustc-wrapper`, and cargo has
  # no rustdoc-wrapper: `-Zbuild-std` compiles std through the wrapper for the
  # custom spec's hashed triple while rustdoc asks for the builtin one, so the
  # run dies on `E0461: couldn't find crate compiler_builtins with expected
  # target triple armv7-rtems-eabihf` (measured, both with and without a clean
  # target dir). The stock spec is the right answer for a DOC gate specifically:
  # the deviation's only effect is `has-thread-local`, which flips
  # `cfg(target_thread_local)`, and no source file in `crates/` mentions that
  # cfg — so no doc link can resolve differently under it. That is a fact about
  # today's tree, and the day a `cfg(target_thread_local)` lands in `crates/`
  # this gate stops covering the image's configuration.
  #
  # BOTH TARGETS, though VxWorks was measured to add 0 sites over RTEMS today
  # (119 vs 120; the difference is `epics-rtems-boot`, which the VxWorks row
  # does not build). That zero is an accident of the two sharing the
  # `epics_embedded_target` gate — 6 cfg predicates in `crates/` name
  # `target_os = "vxworks"` without naming rtems, so a VxWorks-only doc link is
  # representable and would go unreported by an RTEMS-only job. Two targets
  # cost ~35 s each warm.
  #
  # The VxWorks row carries `scripts/libc-std-patch.sh` for the same reason
  # `vxworks-check.sh` does — a manifest `[patch.crates-io]` never reaches the
  # `-Zbuild-std` graph, so std compiles against rust-src's stock libc and
  # fails on `killpg` — and drops `--locked` and restores `Cargo.lock`
  # afterwards for the same reason: a config-added patch entry needs a lock
  # bookkeeping write that `--locked` refuses.
  #
  # `--document-private-items` on both rows, matching the host job. Without it
  # these rows structurally cannot see a private item that exists only on one
  # target, and that is the whole shape of the priority map:
  # `map_epics_priority`, `map_epics_priority_rtems`, `map_epics_priority_vxworks`
  # and `rtems_core_priority` are each private and each gated to one
  # `target_os`, so a doc under one gate citing an item under another resolves
  # in no configuration. `epics-libcom-rs` was 0 sites without the flag on
  # either target and 1 (RTEMS) / 3 (VxWorks) with it when this job landed;
  # those four are closed. The one site the crate reads today is a different
  # and target-independent one, so the flag still has no live example of the
  # one-target-only shape that justifies it.
  #
  # Still red, and against a different backlog than the one this comment was
  # first written for. Measure this on the union of the branch tips in flight,
  # never on one of them: 6 sites on RTEMS and the same 6 on VxWorks, every one
  # of them present only on `1976f53b2` — 5 in `epics-base-rs`
  # (`server/ioc_app.rs`, `server/iocsh/{misc_commands,mod}.rs`) and 1 in
  # `epics-libcom-rs` (`runtime/log.rs`), split 3 unresolved-link / 3
  # private-item. The `epics-ca-rs` sites an earlier reading of this comment
  # named are gone, closed on `1976f53b2` and `332b2b0c5`; that reading was
  # taken on a single tip and was already false of the union when it was
  # written. Read-only union tree `e69475a27` (`git merge-tree`), the other
  # five crates exit 0 on both targets.
  rustdoc-embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        key: rustdoc-embedded
    # The closure and the per-crate features are the ones `scripts/rtems-check.sh`
    # and `scripts/vxworks-check.sh` compile. Kept as `--lib`: the host CLI
    # binaries do not build for either target and were never meant to, which is
    # the same reason those scripts name their target binaries one by one.
    #
    # `asyn-rs` joined that closure in `8ea3459f`, and its `epics` selection is
    # the scripts' `CRATE_FEATURES[asyn-rs]`. Its row used to die before
    # rustdoc ran, because `socket2` was a production dependency and does not
    # compile for either triple (20 errors on `armv7-rtems-eabihf`, 12 on
    # `x86_64-wrs-vxworks`, measured). The `runtime::socket` swap the two gate
    # scripts depend on has landed: `socket2` is now a host-only
    # `dev-dependency`, and the row documents the crate on both targets.
    - name: rustdoc for armv7-rtems-eabihf
      env:
        RUSTDOCFLAGS: -D warnings
        RTEMS_USE_STOCK_SPEC: "1"
      run: |
        set -u
        rc=0
        for crate in epics-libcom-rs epics-base-rs epics-ca-rs epics-pva-rs \
                     epics-rtems-boot epics-bridge-rs asyn-rs; do
          feats=()
          case "$crate" in
            epics-bridge-rs) feats=(--features qsrv-core,pvalink) ;;
            epics-ca-rs)     feats=(--features client-core) ;;
            asyn-rs)         feats=(--features epics) ;;
          esac
          echo "::group::$crate --lib (armv7-rtems-eabihf)"
          cargo +nightly doc --no-deps --no-default-features --document-private-items \
            -Zbuild-std=std,panic_abort --target armv7-rtems-eabihf \
            -p "$crate" --lib ${feats[@]+"${feats[@]}"} || rc=1
          echo "::endgroup::"
        done
        exit "$rc"
    - name: rustdoc for x86_64-wrs-vxworks
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        set -u
        cp Cargo.lock Cargo.lock.rustdoc-bak
        trap 'mv -f Cargo.lock.rustdoc-bak Cargo.lock' EXIT
        cfg=()
        while IFS= read -r line; do cfg+=(--config "$line"); done \
          < <(./scripts/libc-std-patch.sh nightly)
        rc=0
        for crate in epics-libcom-rs epics-base-rs epics-ca-rs epics-pva-rs \
                     epics-rtems-boot epics-bridge-rs asyn-rs; do
          feats=()
          case "$crate" in
            epics-bridge-rs) feats=(--features qsrv-core,pvalink) ;;
            epics-ca-rs)     feats=(--features client-core) ;;
            asyn-rs)         feats=(--features epics) ;;
          esac
          echo "::group::$crate --lib (x86_64-wrs-vxworks)"
          cargo +nightly doc --no-deps --no-default-features --document-private-items \
            "${cfg[@]}" -Zbuild-std=std,panic_abort --target x86_64-wrs-vxworks \
            -p "$crate" --lib ${feats[@]+"${feats[@]}"} || rc=1
          echo "::endgroup::"
        done
        exit "$rc"
