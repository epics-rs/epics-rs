[[deviation]]
id = "CBUG-F13"
bucket = "NOT-REPRODUCED"
upstream = "asyn / asynManager"
record_types = ["asyn"]
fields = ["ENBL"]
surface = ["value_numeric", "value_string"]
requires = ["multidevice-asyn-port-shutdown"]
why = """
asynManager::shutdownPort (asynManager.c:2253-2308) writes enabled=FALSE and
defunct=TRUE into findDpCommon(puserPvt) -- the dpCommon of the DEVICE the
shutting-down user is bound to -- while nulling drvPvt on every interface of the
whole PORT (:2296-2301). The shell command that drives it binds at addr 0
(asynShellCommands.c:1331: connectDevice(pasynUser,portName,0)), so on an
ASYN_MULTIDEVICE port pport->dpc.defunct is never set at all. Measured against
libasyn at pin 731d616e, a port registered ASYN_MULTIDEVICE|ASYN_DESTRUCTIBLE and
shut down through an addr-0 user still reports isEnabled=1 at addr -1 and addr 1
(0 only at addr 0), still accepts enable() and lockPort() there, still hands out
the interface from findInterface with drvPvt already NULL, and asynReport prints
the port normally instead of "<port> destroyed" -- every port-level defunct check
(report :1041, findInterface :1487, registerInterrupt :2424, getInterruptPvt
:2475, add/removeInterruptUser :2561/:2603) reads pport->dpc.defunct and sees a
live port. That is wrong: the interfaces C nulled belong to the port, so the
addresses C leaves enabled are enabled onto a driver that is gone and the next
call through them dereferences NULL. The single-device case, where findDpCommon
resolves to the port's own dpc, refuses port-wide -- which is what shutdownPort
means. The port models defunct at the port: shutdown_lifecycle clears the port's
enabled and every device dpCommon's enabled together with defunct, so ENBL reads
0 at every ADDR and asynReport prints "destroyed".
Expect: after asynShutdownPort on a multi-device asyn port, C's asyn record at
ADDR!=0 reads ENBL=1 (Enable) while the port reads ENBL=0 (Disable); at ADDR 0
both read 0. Unexercised by the current oracle -- the fat softIoc registers no
multi-device ASYN_DESTRUCTIBLE port and no phase issues asynShutdownPort -- so
this row is coverage until such a port is staged.
"""

