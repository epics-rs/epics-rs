[package]
name = "asyn-rs"
version.workspace = true
edition.workspace = true
description = "Rust port of EPICS asyn - async device I/O framework"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
parking_lot = "0.12"
thiserror = "2"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
tracing = "0.1"
epics-base-rs = { workspace = true, optional = true }
# `runtime::socket` is the workspace's one owner of "open a socket, set the
# address-reuse/broadcast options, then bind" — the ordering `socket2` cannot
# express on the embedded triples, because it does not build for either of
# them. Not optional and not behind `epics`: `drivers::ip_port` and
# `drivers::ip_server_port` are unconditional modules, so their socket layer
# has to be too.
epics-libcom-rs = { workspace = true }

[features]
default = ["epics"]
epics = ["dep:epics-base-rs"]
# Opt-in FTDI MPSSE / D2XX hardware support. Without this flag the
# `drivers::ftdi::DrvAsynFtdiPort` scaffold compiles cleanly but
# `connect()` returns an "feature not enabled" error so application
# code fails fast rather than silently no-ops. Wiring the actual
# device path is a follow-up — once a use case lands, add an
# `ftdi-mpsse = "..."` dep below this section gated to
# `target.'cfg(unix)'`.
ftdi-mpsse = []

# Opt-in USBTMC hardware support. Same scaffold convention as
# `ftdi-mpsse`: without this flag the `drivers::usbtmc::DrvAsynUsbtmcPort`
# scaffold compiles cleanly but `connect()` errors with a "feature
# not enabled" message. Adding the `nusb`/`rusb` dep belongs in a
# follow-up PR once a use case lands.
usbtmc = []

# Opt-in VXI-11 hardware support. Without this flag the
# `drivers::vxi11::DrvVxi11Port` scaffold compiles cleanly but
# `connect()` errors with a "feature not enabled" message. The ONC
# RPC `create_link` / `device_write` / `device_read` /
# `destroy_link` plumbing belongs in a follow-up PR (`onc-rpc` or
# `sunrpc` crate).
vxi11 = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32 serial backend (drivers::serial_port on Windows == C
# drvAsynSerialPortWin32.c): raw CreateFile/DCB/COMMTIMEOUTS/ReadFile/
# WriteFile/PurgeComm bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Devices_Communication",
    # ReadFile/WriteFile signatures name OVERLAPPED; CreateFileW names
    # SECURITY_ATTRIBUTES — both must resolve even though we pass NULL.
    "Win32_System_IO",
    "Win32_Security",
] }

[dev-dependencies]
# Dev-only and `path`-only, so `cargo package` drops it from the uploaded
# manifest: the source guards in this crate share one production-slice rule.
source-guard = { path = "../source-guard" }
# Dev-only and `path`-only: the shared rule for a test that must NAME the port
# its subject binds, so a number lost between the probe and the bind is a retry
# and not a red test. Shared rather than copied because asyn-rs and epics-ca-rs
# cannot see each other's `tests/`, and two copies of a retry rule are two
# chances to retry on the wrong evidence.
named-port = { path = "../named-port" }
tempfile = "3"
# The `#[epics_test]` attribute itself. Named directly rather than through
# `epics_base_rs`, which re-exports it but is optional here: the lib's own
# `#[cfg(test)]` bodies must build under `--no-default-features`, this crate's
# declared embedded configuration.
epics-macros-rs = { workspace = true }
record-seam-gate = { path = "../../tools/record-seam-gate" }
tokio = { version = "1", features = ["full", "test-util"] }
# Tests only, and host-only. Production code reaches sockets through
# `epics_libcom_rs::runtime::socket`; these are the tests that read an option
# back off a bound socket (`SockRef::reuse_port`) to prove the seam set it,
# which needs socket2's getters. They never build for the embedded triples —
# socket2 does not compile there, which is why the seam exists.
[target.'cfg(not(any(target_os = "rtems", target_os = "vxworks")))'.dev-dependencies]
socket2 = { version = "0.5", features = ["all"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Integration tests that drive the asyn record through a real CA server's
# put gate (the process-passive `should_process` path). No dependency cycle:
# epics-ca-rs does not depend on asyn-rs.
epics-ca-rs = { workspace = true }

[[bench]]
name = "throughput"
harness = false

# Integration tests of the EPICS-IOC surface — the record device support, the
# iocsh commands, and `epics_base_rs`'s database — so they exist only when that
# surface does. Declared as `required-features` rather than `#![cfg(feature =
# "epics")]` inside each file: cargo then SKIPS the target, instead of
# compiling a file whose contents have been cfg'd away to nothing, which reads
# as a passing test that never ran. The other eight files in `tests/` name only
# the framework and are auto-discovered unchanged; `tools/target-cfg-gate`
# holds the two lists to each other, for every crate rather than this one.
[[test]]
name = "enum_property_post_mask"
required-features = ["epics"]

[[test]]
name = "iocsh_port_is_traceable"
required-features = ["epics"]

[[test]]
name = "ip_server_port_accepts"
required-features = ["epics"]

[[test]]
name = "port_runtime_lifetime"
required-features = ["epics"]

[[test]]
name = "process_gate_tests"
required-features = ["epics"]

[[test]]
name = "spc_nomod_fields_refuse_every_runtime_write"
required-features = ["epics"]

[[test]]
name = "time_series_busy_post_mask"
required-features = ["epics"]
