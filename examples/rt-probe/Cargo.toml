[package]
name = "rt-probe"
version.workspace = true
edition.workspace = true
description = "PREEMPT_RT measurement harness: scan jitter, CA/PVA monitor latency, priority-inversion proof"
publish = false

[features]
# Forwards to `epics-base-rs/linux-rt`, which is what flips
# `runtime::sync::PriorityInheritanceMutex` from `parking_lot::Mutex` to a
# `pthread_mutex_t` carrying `PTHREAD_PRIO_INHERIT`. The `pi-proof`
# subcommand is built twice — once with, once without — and the two runs
# are the PI-on / PI-off arms.
linux-rt = ["epics-base-rs/linux-rt"]

[dependencies]
epics-base-rs = { workspace = true }
epics-ca-rs = { workspace = true }
epics-pva-rs = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[[bin]]
name = "rt-probe"
path = "src/main.rs"
