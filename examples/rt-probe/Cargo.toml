[package]
name = "rt-probe"
version.workspace = true
edition.workspace = true
description = "PREEMPT_RT measurement harness: scan jitter, CA/PVA monitor latency, priority-inversion proof"
publish = false

[dependencies]
epics-base-rs = { workspace = true }
epics-ca-rs = { workspace = true }
epics-libcom-rs = { workspace = true }
epics-pva-rs = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[[bin]]
name = "rt-probe"
path = "src/main.rs"
