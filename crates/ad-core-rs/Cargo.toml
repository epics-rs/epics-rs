[package]
name = "ad-core-rs"
version.workspace = true
edition.workspace = true
description = "Core types and base classes for areaDetector-rs"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
asyn-rs = { workspace = true }
# Not optional, unlike `epics-base-rs` below: the plugin data threads are
# created through `runtime::task::MandatoryThread`, and that is the same
# whether or not this crate is built into an IOC. The runtime layer is the
# bottom of the workspace, so this adds no cycle.
epics-libcom-rs = { workspace = true }
epics-base-rs = { workspace = true, optional = true }
epics-ca-rs = { workspace = true, optional = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures-util = "0.3"
tracing = "0.1"
thiserror = "2"
parking_lot = "0.12"

[features]
default = []
ioc = ["dep:epics-base-rs", "dep:epics-ca-rs", "asyn-rs/epics"]
