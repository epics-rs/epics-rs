[package]
name = "mqtt-rs"
version.workspace = true
edition.workspace = true
description = "MQTT driver for epics-rs — publish/subscribe MQTT topics as EPICS records"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
asyn-rs = { workspace = true }
epics-libcom-rs = { workspace = true }
rumqttc-v5-next = { version = "0.34", default-features = false }
serde_json = { workspace = true }
socket2 = "0.6"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
thiserror = "2"

epics-base-rs = { workspace = true, optional = true }
epics-ca-rs = { workspace = true, optional = true }

[features]
default = []
ioc = ["dep:epics-base-rs", "dep:epics-ca-rs", "asyn-rs/epics"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
asyn-rs = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }
# `SO_REUSEPORT` for the tests' `BrokerPort`.
socket2 = { version = "0.6", features = ["all"] }
