[package]
name = "epics-libcom-rs"
version.workspace = true
edition.workspace = true
description = "EPICS libCom for Rust — task seam, thread priority bands, errlog, environment and time primitives, and the protocols' shared socket layer"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
parking_lot = "0.12"
tracing = "0.1"
# `runtime::general_time` formats an `epicsTimeStamp` the way C's
# `epicsTimeToStrftime` does; `runtime::log` timestamps every errlog line the
# same way.
chrono = "0.4"
# `runtime::env::iocsh_register_common` resolves the `IOCSH_*` environment
# defaults from the host name, exactly as C's `iocshRegisterCommon` does.
hostname = "0.4"

# tokio: the hosted build uses the full runtime; the RTEMS build drops the
# `net`, `signal`, and `process` features — the ones that pull `mio`,
# `signal-hook-registry`, and `socket2`, none of which build for
# armv7-rtems-eabihf. Declared per-target rather than in shared `[dependencies]`
# because Cargo UNIONS a dependency's features across all matching tables, so a
# shared `full` would re-add the dropped features on RTEMS. The retained set
# (rt/rt-multi-thread/time/sync/macros/io/fs) keeps every non-net tokio API the
# always-compiled code uses (Handle, block_in_place, select!, sync primitives)
# compiling on RTEMS; those paths are unused there (the seam routes to the
# background executor) but must still type-check for `--lib`.
[target.'cfg(not(target_os = "rtems"))'.dependencies]
tokio = { version = "1", features = ["full"] }
# `socket2` + `if-addrs` back the async UDP stack (`net::async_udp_v4` /
# `net::iface_map`). Host-only for the same reason the whole socket half of
# `net` is: they do not build for armv7-rtems-eabihf, and the RTEMS CA server
# uses the separate S1 raw-libc socket driver instead. The module gate in
# `net/mod.rs` matches this table.
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

[target.'cfg(target_os = "rtems")'.dependencies]
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

# Every unix: `runtime::time::thread_sleep_quantum` asks the OS for the clock
# tick rate
# via `sysconf(_SC_CLK_TCK)` rather than restating it as a Rust constant — on
# RTEMS that call resolves to the tick period configured in
# `epics-rtems-boot`, so the C `#define` stays the single source of truth.
#
# Linux-only *uses* remain gated at their call sites (`SO_RXQ_OVFL` setsockopt
# and `recvmsg`/cmsg parsing in `net::async_udp_v4`, `getifaddrs` in
# `net::iface_map`, `SCHED_FIFO` in `runtime::task`, `PTHREAD_PRIO_INHERIT` in
# `runtime::sync`); this gate governs only whether libc is linked at all.
# Windows still skips it entirely.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Dev-only, path-only (no `version`, so `cargo publish` strips the entry
# entirely): the shared `rtems-exec-model` test-gating census, called by
# `tests/rtems_exec_model_gate.rs`. Shared rather than copied because every
# crate that declares the feature has the same hole, and copies of a 300-line
# audit is how copies of a rule come to disagree.
rtems-exec-gate = { path = "../../tools/rtems-exec-gate" }
tempfile = "3"
serial_test = "3"
# Test-only: `runtime::log`'s tests install a bare `tracing` registry to prove
# the
# errlog sink stays silent when nothing is listening.
tracing-subscriber = "0.3"

[features]
# Host-selectable RTEMS execution model. Routes the `runtime::task`
# spawn/sleep/interval seam to the std-thread background executor (callback
# pool + delayed timer + scanOnce worker) on a HOSTED target, instead of the
# tokio runtime — the same
# runtime-free backend the RTEMS build uses unconditionally. Intended for a
# Linux (e.g. PREEMPT_RT) blocking-front-end deployment that runs the
# `std::net` CA server driver and wants async record-processing completion
# driven on dedicated OS threads with no tokio reactor. Compile-time backend
# switch (see `build.rs`, which turns this into the `exec_backend` cfg). OFF by
# default: the hosted default is byte-identical without it.
rtems-exec-model = []
# Linux PREEMPT_RT real-time deployment opt-in. Wires
# `runtime::sync::PriorityInheritanceMutex` to a `pthread_mutex_t` configured
# with `PTHREAD_PRIO_INHERIT` (epics-base 7-E `5a8b6e41`). No-op on non-Linux.
# Off
# by default — only enable on systems running with SCHED_FIFO / SCHED_RR where
# unbounded priority inversion is a risk.
linux-rt = []
