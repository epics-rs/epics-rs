name: Cross-platform build

# Build + test the whole workspace on macOS, Linux, and Windows,
# each on both arm64 and x86_64. The strict lint gate (clippy
# `-D warnings`, doctests, feature-gated suites) stays in `rust.yml`
# on Linux x86_64 — running it 6× would only add platform-specific
# clippy noise. This workflow proves the code *compiles and tests*
# everywhere; `rust.yml` proves it's *clean* on the canonical target.
#
# Hosted-runner notes:
#   * `ubuntu-24.04-arm` / `windows-11-arm` are GitHub-hosted arm64
#     runners — free for public repositories, billed for private ones.
#   * `macos-15-intel` is an Intel (x86_64) macOS image; `macos-latest`
#     (macos-15) is Apple Silicon (arm64).
# The crates carry no native C `-sys` dependencies (TLS is rustls+ring,
# compression is the pure-Rust lz4_flex), so no platform C toolchain or
# vendored library is needed beyond the runner default.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

# A new push to the same PR branch cancels the in-flight matrix. On main,
# never cancel: a `gh run rerun --failed` of an OLDER main run re-enters
# this group and would cancel the in-progress run for the newer commit
# (observed 2026-07-12: rerunning the run for a merge commit cancelled the
# release-commit run that followed it). Main runs are rare enough that
# letting them coexist costs less than losing head-of-main coverage.
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # This workflow never builds the RTEMS target, so the rustc-wrapper wired
  # in .cargo/config.toml (the has-thread-local spec rewrite — a pure
  # passthrough for host builds) has no role in any cell, and on Windows
  # cargo cannot execute a .sh wrapper at all (os error 193, measured on
  # this matrix 2026-07-24). An EMPTY RUSTC_WRAPPER disables a config-wired
  # wrapper outright — cargo treats empty-env as "no wrapper", it does not
  # fall back to the config value (measured on cargo 1.94 against a broken
  # config path: hard error without the env, clean build with it). Set for
  # the whole matrix, not just Windows: uniform, and a no-op on Unix.
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the others — each cell
      # reports portability independently.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: taiki-e/install-action@nextest

      # Per-platform target cache. Keyed on the matrix name so the
      # six cells don't clobber each other's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Compiles libs, bins, AND test targets — the surest catch for
      # platform-specific source that isn't `#[cfg]`-gated.
      - name: Build (workspace + tests)
        run: cargo build --workspace --tests --verbose

      # `ci` profile (.config/nextest.toml) adds retries for the
      # genuinely flaky network/timing integration suites.
      # epics-oracle-rs is excluded: it boots the compiled C `softIoc` for
      # ground truth and fails loudly (by design) without the C EPICS tree,
      # which no runner has. Excluded here — not silenced — and still runs
      # locally where the tree exists.
      # The reference_trees suite is excluded the same way and for the same
      # reason, via profile.ci's default-filter in .config/nextest.toml — it
      # reads epics-base sources directly and this job provisions none.
      - name: Test (nextest)
        run: cargo nextest run --workspace --exclude epics-oracle-rs --profile ci
