name: Interop (gated)

# Runs the wire-golden + interop nextest profile. Heavy: builds
# epics-base (CA reference) and pvxs (PVA reference) on the runner.
# Triggered manually + on a weekly cadence so the default PR loop
# stays fast (`rust.yml` runs the default profile only).
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 03:00 UTC. Catches reference-implementation drift
    # without delaying weekday PRs.
    - cron: '0 3 * * 0'
  pull_request:
    # PRs touching wire-shape or interop test sources opt in.
    paths:
      - 'crates/epics-ca-rs/src/codec.rs'
      - 'crates/epics-ca-rs/src/protocol.rs'
      - 'crates/epics-ca-rs/src/server/**'
      - 'crates/epics-ca-rs/tests/wire_golden*.rs'
      - 'crates/epics-ca-rs/tests/interop_*.rs'
      - 'crates/epics-ca-rs/tests/cases/**'
      - 'crates/epics-pva-rs/src/codec.rs'
      - 'crates/epics-pva-rs/src/proto/**'
      - 'crates/epics-pva-rs/src/pvdata/**'
      - 'crates/epics-pva-rs/src/server_native/**'
      - 'crates/epics-pva-rs/tests/wire_golden*.rs'
      - 'crates/epics-pva-rs/tests/interop_*.rs'
      - 'crates/epics-pva-rs/tests/pva_cases/**'
      - '.config/nextest.toml'
      - '.github/workflows/interop.yml'

env:
  CARGO_TERM_COLOR: always
  EPICS_BASE_VERSION: R7.0.8
  PVXS_VERSION: 1.3.3

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    # ── Toolchain ──────────────────────────────────────────────
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.0
    - uses: taiki-e/install-action@nextest

    # ── EPICS reference build ──────────────────────────────────
    # Cache /opt/epics across runs. Cache key bumps when version
    # changes. ~3 GB; full first-time build ~12 min, cache restore
    # ~30 s.
    - name: Restore epics-base cache
      id: cache-epics
      uses: actions/cache@v4
      with:
        path: /opt/epics-base
        key: epics-base-${{ env.EPICS_BASE_VERSION }}-ubuntu-latest

    - name: Build epics-base if cache miss
      if: steps.cache-epics.outputs.cache-hit != 'true'
      run: |
        sudo mkdir -p /opt/epics-base
        sudo chown $USER /opt/epics-base
        cd /tmp
        git clone --depth 1 --branch ${{ env.EPICS_BASE_VERSION }} \
          https://github.com/epics-base/epics-base.git
        cd epics-base
        make -j2
        cp -r . /opt/epics-base/

    - name: Restore pvxs cache
      id: cache-pvxs
      uses: actions/cache@v4
      with:
        path: /opt/pvxs
        # -v2: earlier cached trees could miss the libpvxs SONAME
        # symlinks, so pvx* failed with "libpvxs.so.1.3: cannot open
        # shared object file". Bump forces one clean rebuild.
        key: pvxs-${{ env.PVXS_VERSION }}-base-${{ env.EPICS_BASE_VERSION }}-ubuntu-latest-v2

    - name: Build pvxs if cache miss
      if: steps.cache-pvxs.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libevent-dev libssl-dev
        sudo mkdir -p /opt/pvxs
        sudo chown $USER /opt/pvxs
        cd /tmp
        git clone --depth 1 --branch ${{ env.PVXS_VERSION }} \
          https://github.com/epics-base/pvxs.git
        cd pvxs
        echo "EPICS_BASE=/opt/epics-base" > configure/RELEASE.local
        make -j2
        cp -r . /opt/pvxs/

    # ── PATH plumbing ──────────────────────────────────────────
    # Tests probe PATH for `softIoc`, `caget`, `pvget`, etc. Put
    # the EPICS host-arch bin dirs first so the tests find them.
    - name: Add EPICS bin dirs to PATH
      run: |
        HOST_ARCH=$(ls /opt/epics-base/bin | head -n1)
        echo "/opt/epics-base/bin/${HOST_ARCH}" >> "$GITHUB_PATH"
        echo "/opt/pvxs/bin/${HOST_ARCH}" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/opt/epics-base/lib/${HOST_ARCH}:/opt/pvxs/lib/${HOST_ARCH}" \
          >> "$GITHUB_ENV"

    # ── Dynamic-linker registration ────────────────────────────
    # The reference binaries link libpvxs.so.1.3 / libca.so by SONAME.
    # LD_LIBRARY_PATH set above reaches nextest's direct children, but a
    # reference binary spawned as a *grandchild* (test process ->
    # pvxget) is not guaranteed to inherit it. Register the lib dirs
    # with the system loader so SONAME resolution works regardless, and
    # fail loudly HERE (with a directory listing) if libpvxs is still
    # absent — that turns a broken cache into an obvious infra error
    # instead of 11 cryptic "cannot open shared object file" test fails.
    - name: Register EPICS/pvxs libs with ldconfig
      run: |
        HOST_ARCH=$(ls /opt/epics-base/bin | head -n1)
        echo "/opt/epics-base/lib/${HOST_ARCH}" | sudo tee /etc/ld.so.conf.d/epics.conf
        echo "/opt/pvxs/lib/${HOST_ARCH}" | sudo tee -a /etc/ld.so.conf.d/epics.conf
        sudo ldconfig
        if ! ldconfig -p | grep -q 'libpvxs\.so'; then
          echo "::error::libpvxs SONAME not registered — /opt/pvxs cache is incomplete"
          ls -l "/opt/pvxs/lib/${HOST_ARCH}" || true
          exit 1
        fi

    # ── Rust interop profile ───────────────────────────────────
    - name: Build workspace
      run: cargo build --workspace --tests

    - name: Run wire-golden + interop suites
      # The `interop` profile in .config/nextest.toml filters to
      # the gated binaries (wire_golden_ext, wire_golden_pvxs,
      # interop_*_rust_*, differential_libca, parity_interop,
      # interop_pvxs). Skips wrapped in `require_tool` print a
      # SKIP line + exit 0 when binaries are still missing.
      run: cargo nextest run --profile interop --no-fail-fast
