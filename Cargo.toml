[workspace]
members = ["crates/*", "examples/*", "tools/*"]
default-members = [
    "crates/ad-core-rs",
    "crates/ad-plugins-rs",
    "crates/asyn-rs",
    "crates/epics-base-rs",
    "crates/epics-ca-rs",
    "crates/epics-macros-rs",
    "crates/epics-pva-rs",
    "crates/epics-bridge-rs",
    "crates/epics-rs",
    "crates/epics-libcom-rs",
    "crates/motor-rs",
    "crates/std-rs",
    "crates/scaler-rs",
    "crates/optics-rs",
    "crates/mca-rs",
    "crates/mqtt-rs",
    "crates/modbus-rs",
    "crates/epics-tools-rs",
    # The codegen drift gates live here as `#[test]`s. They are in
    # default-members so a BARE `cargo nextest run` catches a stale generated
    # table — a gate you have to remember to invoke is not a gate.
    "tools/dbd-codegen",
    "tools/env-codegen",
    # Same reason: the record-processing runtime-seam census's own boundary
    # tests. The per-crate halves ride their crates; these prove the slicer.
    "tools/record-seam-gate",
    # And again: the production-slice rule every source guard in the workspace
    # runs on. Its own boundary tests are what keep a guard from going quiet.
    "crates/source-guard",
    # Same reason again: the IOC-spawn census checks .config/nextest.toml
    # against the sources, so a new test binary that spawns an IOC without
    # being declared in a test-group is red on the commit that adds it.
    "tools/ioc-spawn-gate",
    # And the exec-backend census, for the same reason and one more of its
    # own: its per-crate halves are `#![cfg(exec_backend)]`, so they compile
    # away in every configuration anyone runs by default. The
    # workspace-level half here is the only reading of the rule a bare
    # `cargo nextest run` can reach, and until this line it was not reachable
    # either.
    "tools/rtems-exec-gate",
    # And again, for the rule that a target declares the cfg its own imports
    # require. The configuration it protects is the one a bare run does not
    # build, so the gate has to ride the run that everybody does make.
    "tools/target-cfg-gate",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.27.0"
authors = ["Sang Woo Kim <sngwkim915@gmail.com>"]
license = "EPICS"
repository = "https://github.com/epics-rs/epics-rs"

[workspace.dependencies]
ad-core-rs = { path = "crates/ad-core-rs", version = "0.27.0" }
ad-plugins-rs = { path = "crates/ad-plugins-rs", version = "0.27.0" }
asyn-rs = { path = "crates/asyn-rs", version = "0.27.0" }
epics-base-rs = { path = "crates/epics-base-rs", version = "0.27.0" }
epics-ca-rs = { path = "crates/epics-ca-rs", version = "0.27.0" }
epics-macros-rs = { path = "crates/epics-macros-rs", version = "0.27.0" }
epics-rtems-boot = { path = "crates/epics-rtems-boot", version = "0.27.0" }
epics-libcom-rs = { path = "crates/epics-libcom-rs", version = "0.27.0" }
epics-pva-rs = { path = "crates/epics-pva-rs", version = "0.27.0" }
epics-bridge-rs = { path = "crates/epics-bridge-rs", version = "0.27.0" }
motor-rs = { path = "crates/motor-rs", version = "0.27.0" }
std-rs = { path = "crates/std-rs", version = "0.27.0" }
scaler-rs = { path = "crates/scaler-rs", version = "0.27.0" }
optics-rs = { path = "crates/optics-rs", version = "0.27.0" }
mca-rs = { path = "crates/mca-rs", version = "0.27.0" }
mqtt-rs = { path = "crates/mqtt-rs", version = "0.27.0" }
modbus-rs = { path = "crates/modbus-rs", version = "0.27.0", package = "epics-modbus-rs" }
epics-tools-rs = { path = "crates/epics-tools-rs", version = "0.27.0" }

# Deployable-image profile for the embedded targets (RTEMS / VxWorks), where
# image size is a real resource: `cargo build --profile release-embedded ...`
# reproduces row 5 of the measured strip/LTO size matrix (vs `--release`+strip:
# CA −15.6/−18.9 %, PVA −19.7/−22.6 %; cold build ~2×).
# `release` itself is untouched, so host build times are unaffected.
[profile.release-embedded]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1


# Both embedded targets need libc definitions that the published crate does
# not yet carry, from the one fork branch `epics-rs-0.2`.
#
# RTEMS 6 (armv7-rtems-eabihf): `time_t`/`clock_t`/`clockid_t`/`dev_t`/`ino_t`/
# `off_t`/`rlim_t` widths, the BSD length byte on every socket address struct,
# and the libbsd values of the socket/poll/getaddrinfo constants.
# `-Zbuild-std` compiles `std` against this same crate, so a wrong `timespec`
# or `sockaddr_in` corrupts std itself rather than only our code -- see the two
# build-refusing asserts in `crates/epics-rtems-boot/src/lib.rs`
# (`_RTEMS_LIBC_TIME_LAYOUT`, `_RTEMS_LIBC_SOCKET_LAYOUT`), which is why this
# is a patch and not a local type definition. `scripts/rtems-check.sh` fails
# all six `image` targets without it.
#
# VxWorks 7 (x86_64-wrs-vxworks): `pread`/`pwrite` (removed upstream in
# 0.2.187, rust-lang/libc#5129) and `killpg` -- std imports all three, and the
# SDK defines none of them, so they are always-failing shims rather than
# extern declarations -- plus `getentropy` over the platform's `randABytes`.
# Without these std itself does not compile for the target.
#
# NOTE a manifest `[patch]` does NOT reach `-Zbuild-std`, which resolves std's
# own libc from rust-src's lock; only a CONFIG-level patch does, and only at
# the exact libc version that lock pins (both measured -- see
# `scripts/libc-std-patch.sh`). The gates and `scripts/embedded-image.sh`
# therefore derive a `--config` patch from this entry via that helper (a
# clone of this rev, version-relabelled for the toolchain), keeping this
# line the single source of truth for both resolutions.
#
# Pinned by rev; the branch is upstream `libc-0.2` (8c6e6710) plus the four
# RTEMS commits (split upstream as PRs `rtems-sockaddr-len` and
# `rtems-type-widths`) and the two VxWorks commits above. The retired
# RTEMS-only pin 6f64e70d stays reachable via the tag `epics-rs-rtems-0.2.188`
# and as an ancestor of `epics-rs-0.2`. Remove this patch once the fixes land
# in a published 0.2 release.
[patch.crates-io]
libc = { git = "https://github.com/physwkim/libc.git", rev = "31d5776f9952aa349813d7fbef3addae1bf0a5ef" }
