[package]
name = "epics-base-rs"
version.workspace = true
edition.workspace = true
description = "Pure Rust EPICS IOC core — record system, database, iocsh, calc engine"
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
bytes = "1"
hostname = "0.4"
socket2 = { version = "0.5", features = ["all"] }
# Cross-platform interface enumeration (Linux/macOS/Windows). Used by
# `epics_base_rs::net::iface_map` to expose ifindex/IP/broadcast/mcast caps.
if-addrs = "0.13"
chrono = "0.4"
parking_lot = "0.12"
tracing = "0.1"
epics-macros-rs = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

# Host-only dependencies — gated out for the RTEMS target (armv7-rtems-eabihf).
#
# `rustyline` pulls `nix`, which does not build for RTEMS (no `sa_sigaction` in
# the RTEMS libc). It backs only the *interactive* iocsh line editor
# (`iocsh::Iocsh::run_repl_interactive`); the piped-stdin REPL covers
# non-interactive use, and RTEMS iocsh wiring is a later increment.
[target.'cfg(not(target_os = "rtems"))'.dependencies]
rustyline = "18"

# Linux-only: `SO_RXQ_OVFL` setsockopt + `recvmsg`/cmsg parsing for
# UDP RX overflow detection (`net::async_udp_v4::recv_from_with_drop_count`).
# Cargo `target.'cfg(target_os = "linux")'` only links libc on Linux —
# macOS / Windows builds skip it entirely.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Dev-only — `path` (no `version`) so `cargo publish` strips this
# from the uploaded manifest. Lets `epics-base-rs` publish first in
# the dependency chain without `epics-ca-rs` already being on crates.io.
[dev-dependencies]
epics-ca-rs = { path = "../epics-ca-rs" }
tempfile = "3"
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# Test-only: captures the `errlog` `tracing` sink so `tests/stdio_device.rs`
# can assert the `stdio` "errlog" stream actually printed the record's VAL.
tracing-subscriber = "0.3"

[features]
# Linux PREEMPT_RT real-time deployment opt-in. Wires `runtime::sync::
# PriorityInheritanceMutex` to a `pthread_mutex_t` configured with
# `PTHREAD_PRIO_INHERIT` (epics-base 7-E `5a8b6e41`). No-op on
# non-Linux. Off by default — only enable on systems running with
# SCHED_FIFO / SCHED_RR where unbounded priority inversion is a risk.
linux-rt = []
# Test-only: enables the `client_server` integration test, whose
# `run_tcp_listener` call must match `epics-ca-rs`'s TLS/cap-token
# signature. `run_tcp_listener` has `#[cfg]`-gated `tls` /
# `cap_token_verifier` params; their presence is governed by
# `epics-ca-rs`'s own `experimental-rust-tls` / `cap-tokens` features.
# Forcing both on here makes the function's arity deterministic
# whenever the test compiles — so the call site passes all 12 args
# unconditionally. `client_server.rs` is gated on this feature, so it
# only compiles when the 12-arg signature is in effect.
ca-server-tls-test = ["epics-ca-rs/experimental-rust-tls", "epics-ca-rs/cap-tokens"]

[[bench]]
name = "record_bench"
harness = false

