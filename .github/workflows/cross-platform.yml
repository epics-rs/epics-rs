name: Cross-platform build

# Build + test the whole workspace on macOS, Linux, and Windows,
# each on both arm64 and x86_64. The strict lint gate (clippy
# `-D warnings`, doctests, feature-gated suites) stays in `rust.yml`
# on Linux x86_64 — running it 6× would only add platform-specific
# clippy noise. This workflow proves the code *compiles and tests*
# everywhere; `rust.yml` proves it's *clean* on the canonical target.
#
# Hosted-runner notes:
#   * `ubuntu-24.04-arm` / `windows-11-arm` are GitHub-hosted arm64
#     runners — free for public repositories, billed for private ones.
#   * `macos-15-intel` is an Intel (x86_64) macOS image; `macos-latest`
#     (macos-15) is Apple Silicon (arm64).
# The crates carry no native C `-sys` dependencies (TLS is rustls+ring,
# compression is the pure-Rust lz4_flex), so no platform C toolchain or
# vendored library is needed beyond the runner default.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

# A new push to the same PR branch cancels the in-flight matrix. On main,
# never cancel: a `gh run rerun --failed` of an OLDER main run re-enters
# this group and would cancel the in-progress run for the newer commit
# (observed 2026-07-12: rerunning the run for a merge commit cancelled the
# release-commit run that followed it). Main runs are rare enough that
# letting them coexist costs less than losing head-of-main coverage.
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo, not even line tables. The all-features test build on
  # 12059ffc07 (1,674 test binaries) takes 109,470 MB with `line-tables-only`
  # and 48,809 MB with 0; 17a131b3b's 69,114 MB was the last that fit. A full
  # disk kills the runner's own diagnostic log, so the job log goes with it.
  # Panics keep their file:line; backtrace frames do not.
  CARGO_PROFILE_DEV_DEBUG: 0
  # This workflow never builds the RTEMS target, so the rustc-wrapper wired
  # in .cargo/config.toml (the has-thread-local spec rewrite — a pure
  # passthrough for host builds) has no role in any cell, and on Windows
  # cargo cannot execute a .sh wrapper at all (os error 193, measured on
  # this matrix 2026-07-24). An EMPTY RUSTC_WRAPPER disables a config-wired
  # wrapper outright — cargo treats empty-env as "no wrapper", it does not
  # fall back to the config value (measured on cargo 1.94 against a broken
  # config path: hard error without the env, clean build with it). Set for
  # the whole matrix, not just Windows: uniform, and a no-op on Unix.
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A cold Unix build (macos-arm64 17-24 min on fork runs, whose ci/*
    # branches never restore a cache) plus the Test step's 30 min cap, so a
    # hang still ends at that cap rather than here.
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      # One platform failing must not cancel the others — each cell
      # reports portability independently.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
            # Cold cache: build 24 min + nextest 14 min (fork run
            # 39797956905). No cache is saved until one run passes.
            timeout: 95
          # Build ~20 min, then nextest ran 13927 of 17023 tests in 25 min
          # before the 45 min default cancelled the job (run 39710144196).
          - name: windows-x86_64
            os: windows-latest
            timeout: 90
            test_timeout: 50
          - name: windows-arm64
            os: windows-11-arm
            timeout: 90
            test_timeout: 50

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: taiki-e/install-action@nextest

      # Per-platform target cache. Keyed on the matrix name so the
      # six cells don't clobber each other's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # The search_udp v6 tests use `::1` and `ensure_iface_socket` needs an up
      # non-loopback IPv4 interface; each fails, not skips, without them.
      # Every hosted image has both, so this only turns an image change into
      # one clear error. Per-OS commands, same two facts.
      - name: Test prerequisites (::1, external NIC) - Linux
        if: runner.os == 'Linux'
        run: |
          python3 -c 'import socket; s = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM); s.bind(("::1", 0)); s.sendto(b"x", s.getsockname())'
          ip -4 -o addr show scope global up | grep -q .

      - name: Test prerequisites (::1, external NIC) - macOS
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import socket; s = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM); s.bind(("::1", 0)); s.sendto(b"x", s.getsockname())'
          ifconfig | grep 'inet ' | grep -qv '127\.0\.0\.1'

      # The multi-interface bind tests hold 127.0.0.2 and 127.0.0.4 as a second
      # NIC; Linux and Windows route all of 127/8 to loopback, Darwin's lo0
      # carries only 127.0.0.1.
      - name: Second loopback addresses - macOS
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.4 up
          # A second broadcast-capable NIC for the multi-NIC broadcast bundle
          # tests, on a feth pair, not en0: the VM's DHCP renewals go
          # unanswered, so en0 is re-leased when its 1 h lease expires, and
          # with an alias on en0 the VM's network never comes back.
          sudo ifconfig feth0 create
          sudo ifconfig feth1 create
          sudo ifconfig feth0 peer feth1
          sudo ifconfig feth1 up
          sudo ifconfig feth0 inet 198.18.0.2 netmask 255.255.255.0 broadcast 198.18.0.255 up

      - name: Test prerequisites (::1, external NIC) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c 'import socket; s = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM); s.bind(("::1", 0)); s.sendto(b"x", s.getsockname())'
          if ($LASTEXITCODE -ne 0) { throw "::1 is not usable" }
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.IPAddress -notlike '169.254.*' })) { throw "no non-loopback IPv4 interface" }

      # Compiles libs, bins, AND test targets — the surest catch for
      # platform-specific source that isn't `#[cfg]`-gated.
      - name: Build (workspace + tests)
        run: cargo build --workspace --tests

      # `ci` profile (.config/nextest.toml) adds retries for the
      # genuinely flaky network/timing integration suites.
      # epics-oracle-rs is excluded: it boots the compiled C `softIoc` for
      # ground truth and fails loudly (by design) without the C EPICS tree,
      # which no runner has. Excluded here — not silenced — and still runs
      # locally where the tree exists.
      # The reference_trees suite is excluded the same way and for the same
      # reason, via profile.ci's default-filter in .config/nextest.toml — it
      # reads epics-base sources directly and this job provisions none.
      # Below the job timeout, so a hang fails this step and the job log is
      # kept; `--status-level slow` is what prints the SLOW line naming a
      # stuck test (profile.ci stops at `retry`). Unix cells take 12-25 min; Windows sets its own.
      - name: Test (nextest)
        timeout-minutes: ${{ matrix.test_timeout || 30 }}
        run: cargo nextest run --workspace --exclude epics-oracle-rs --profile ci --status-level slow
